# ops/call_agent — Call Agent v1.1 configuration
# Secrets live in env vars (.env locally, repo secrets on Actions) — never here.

justcall:
  # JustCall numbers to poll for completed INBOUND calls. V1 scope: exactly one
  # number — the main A+ line. This is a list so more lines can be added later
  # without code changes, but before adding a number confirm its recording
  # disclosure is in place (see README — CA two-party consent).
  # Roman 2026-09-16: "i want all of our lines transcribed." Recording
  # disclosure on the added lines is his call and he has made it; the
  # require_recording guardrail below still means an unrecorded call is never
  # transcribed, whatever line it came in on.
  #
  # Why it mattered: a parent called this company twice on 2026-08-28, spoke
  # to Roman for 3m43s and 37s about their son's PSAT prep, and then texted
  # 18 days later opening "Hey Roman". There was no HubSpot record of any of
  # it, because inbound calls on his line were not monitored. Over 30 days
  # that blind spot covered 41 answered inbound calls, 25 of them on the
  # sales line.
  monitored_numbers:
    - "+18188506284"        # Main A+ line (IVR announces recording)
    - "+18188691627"        # Customer support line (disclosure confirmed by Roman 2026-07-20)
    - "+18185736644"        # Sales line — 25 answered inbound calls/month, previously unseen
    - "+18185736293"        # Roman's line — where the PSAT parent called
    - "+18888697637"
    - "+13235150123"

  # Consent guardrail: calls with no recording are never transcribed or
  # summarized — they are skipped and counted in the digest. Keep true.
  require_recording: true

  # Outbound monitoring (Roman 2026-07-27): ALL company lines, both directions.
  # Consent decision: process only calls that HAVE recordings (require_recording
  # applies to both directions); disclosure practice on outbound dials is
  # Roman's responsibility — no IVR plays on outgoing calls.
  monitor_outbound: true

  # Only calls of this type are processed (others are logged and ignored).
  # Live API values (lowercase, case-insensitive here):
  # answered | missed | voicemail | abandoned.
  process_call_types: ["answered"]

  # Hang-up filter: transcripts shorter than this are IVR fragments/hang-ups —
  # no Claude call, no HubSpot writes, just a count in the digest.
  # (3 of 7 answered calls in the 2026-07 test week were these.)
  min_transcript_chars: 200

  # Friendly names for the digest's daily-activity brief (account-wide stats
  # cover ALL lines, not just monitored_numbers). Unnamed lines display as
  # a formatted number.
  line_names:
    "+18188506284": "Main line"
    "+18188691627": "Support line"
    "+18185736644": "Sales line"   # outbound to leads + texting missed calls
    "+18185736293": "Roman's line"
    "+18185736258": "Recruitment & hiring"
    "+13235150123": "Sales line 2"
    "+18888697637": "Sales line 3 (888)"   # toll-free; barely published anywhere

  # JustCall interprets the from_datetime filter in the ACCOUNT timezone,
  # while response timestamps (call_date/call_time) are UTC (verified live
  # 2026-07-17). Must match the JustCall account setting.
  account_timezone: "America/Los_Angeles"

  # First-run lookback when no state cursor exists yet (days).
  initial_lookback_days: 1
  # Overlap window re-queried each run to survive crashes (idempotent via call IDs).
  overlap_minutes: 60
  # Recording-but-no-transcript calls younger than this are retried next run
  # (JustCall AI transcription lags the call by a few minutes); older ones are
  # counted as real "no transcript" skips. MUST stay below overlap_minutes or
  # a pending call can fall out of the re-fetch window before it's retried.
  transcript_grace_minutes: 45
  # Pause between per-call AI-transcript fetches (JustCall burst limit is
  # 30 req/min on the Team plan).
  ai_fetch_pause_seconds: 2

# Immediate alerts for inbound calls that never became conversations.
# Metadata only (caller, line, time — nothing is transcribed or summarized),
# so this safely covers ALL account lines, not just monitored_numbers.
# Speed-to-callback is the conversion lever: contact rates drop ~10x after
# the first few minutes.
missed_calls:
  enabled: true
  alert_types: ["missed", "abandoned", "voicemail"]
  channel: "#calls"       # falls back to slack.alert_channel when empty
  create_task: true       # same-day HIGH call-back task (default task owner)
  # Spam filter: "abandoned" (hung up in the IVR before any agent rang) is
  # the robocall signature. When true, abandoned calls alert ONLY if the
  # number matches a HubSpot contact; unknown ones are counted silently
  # (still in the daily brief totals). Missed/voicemail always alert —
  # those callers navigated the IVR like a human.
  abandoned_known_only: true

claude:
  # Repo-standard model (matches marketing/scripts/*).
  model: "claude-opus-4-7"
  max_tokens: 2000
  # Cost guard: transcripts longer than this are truncated before summarization
  # (truncation is noted in the summary metadata + digest line).
  max_transcript_chars: 50000

# Spam gate (Roman 2026-09-16: "we get a bunch of spam, you gotta be able to
# filter numbers some how"). Applied to ANSWERED inbound calls before any
# transcription, HubSpot write or contact creation.
#
# Built from 30 days of real traffic rather than guessed. Of 362 inbound
# calls, 166 were "abandoned" (hung up in the IVR — the robocall signature)
# and are excluded already by process_call_types. Of the 132 answered ones,
# junk has one clear shape: SHORT and no caller-ID name. Every call this gate
# drops in that window was under 20 seconds with a blank caller-ID, and the
# longest was 18s. Real conversations look nothing like it: of the 58 answered
# calls over three minutes, 52 carried a human-looking name.
#
# All THREE conditions must hold before a call is dropped, so a short call
# from a known family survives, and a long call from a blank caller-ID
# survives. Junk has to look like junk on every axis.
spam_gate:
  enabled: true
  min_seconds: 20          # simulated: drops 18 of 132, none longer than 18s
  # A caller-ID is "not human-looking" when it is blank, a telco generic
  # ("Wireless Caller"), JustCall's "New JustCall Contact" placeholder, or a
  # place-plus-state string ("Sherman Oaks Ca"). Shared with the CallRail
  # shell detector already in this file.
  require_unknown_to_hubspot: true    # a known family is never dropped
  # Dropped calls are still counted in the daily digest, so a filter that
  # starts eating real calls is visible rather than silent.

hubspot:
  # Roman 2026-09-16. A caller who talks to us and has no contact record
  # leaves no trace at all: the PSAT parent spoke to Roman for 3m43s and was
  # still a stranger 18 days later, so his follow-up text had nothing to
  # attach to. Contacts are created ONLY for calls that clear the spam gate
  # and produce a real transcript, which is a much narrower door than the
  # CallRail auto-create that generated 838 junk contacts in July.
  auto_create_contacts: true
  # Lead status stamped on a contact this agent creates, so they are
  # distinguishable from intake-captured records.
  created_contact_lead_status: "NEW"
  # Owner SEAT for a contact this agent creates (key into owners: below).
  # Paola does 100% of call follow-up (Roman 2026-08-13), so she owns the
  # caller too. Falls back to default_task_owner when unset.
  created_contact_owner: paola

  # Owner IDs (HubSpot owner ids, not user ids) for task/ticket assignment.
  owners:
    roman: 38681249
    paola: 81494333
    janelle: 80047202
    yolanda: 86868539
  # Follow-up routing (Roman 2026-08-13): sales calls ring Roman first,
  # overflow to Paola, and Paola does 100% of follow-up. Calls ROMAN answered
  # therefore ALWAYS assign tasks to default_task_owner (owner_hint ignored),
  # and the task body opens with a handoff block (Roman spoke to this family
  # + the model's handoff brief). Calls answered by anyone else: owner_hint
  # routes ("have Janelle call..."), else default_task_owner.
  default_task_owner: paola
  # Scheduling routing (Paola 2026-09-01): trial/session logistics (confirming
  # a trial, texting a family about day/time, sending a tutor profile, calling
  # back about a booked session) are the scheduling team's work, not follow-up.
  # Claude routes each action item (ACTION_ROUTES / SUMMARY_PROMPT step 3);
  # scheduling items always get a "[Scheduling] " subject prefix, and when this
  # names a key from owners: above they are ASSIGNED there instead of to
  # default_task_owner. Empty until Roman confirms the scheduling team's
  # HubSpot owner id — until then the prefix alone marks them.
  scheduling_task_owner: ""
  # Follow-up tasks are due this many business days after the call.
  task_due_business_days: 1

  # Negative-sentiment / complaint check-in ticket (Support Pipeline).
  ticket:
    pipeline: "0"                 # Support Pipeline
    stage: "131537027"            # "Working on it"
    priority: "HIGH"
    # Follow-up owner, matching default_task_owner above: the task and the
    # ticket for the same call must land on one person (Roman 2026-08-26).
    owner: paola
    check_in_business_days: 2     # companion check-in task due date

slack:
  # Daily digest channel — used only with SLACK_BOT_TOKEN.
  # With SLACK_WEBHOOK_URL the webhook's own channel config wins.
  # #calls is PRIVATE — the bot must be invited (/invite in the channel).
  channel: "#calls"
  # Channel for immediate negative-sentiment/complaint alerts
  # (fires per call, not end-of-day). Leave empty to disable immediate
  # alerts (they still appear in the digest).
  alert_channel: "#calls"

coaching:
  # Rubric-based call scoring for coaching (see rubric.md — edit anchors
  # there, no code changes). Scores every processed call, attributed to the
  # team member who answered (JustCall agent_name). Coaching cards post to a
  # PRIVATE channel per call; with note_to_contact true (below) the full
  # evaluation is ALSO attached as a Note on the matched HubSpot contact.
  # Falls back to slack.alert_channel when channel is empty.
  enabled: true
  channel: "#calls"           # private; bot must be invited
  rubric_path: "ops/call_agent/rubric.md"
  # Slack user IDs — whoever handled the call is @-tagged on their coaching
  # card AND receives it as a DM (a tag in #calls alone doesn't notify
  # non-members of the private channel; the DM guarantees delivery).
  # Keys match the first name in JustCall agent_name, lowercase.
  slack_user_ids:
    roman: U05NA7UMSSV
    paola: U094B5DRZBR
    janelle: U08S3CG8XNY
    yolanda: U0A6XGBU7QT
  dm_person: true
  # Also attach the full rubric evaluation as a Note on the matched HubSpot
  # contact. NOTE: contact Notes are visible to everyone with HubSpot access —
  # coaching scores become team-visible on family records. Flip to false to
  # keep coaching in the private Slack channel only.
  note_to_contact: true

state:
  # Repo-relative path; committed back by the workflow (topic-gen pattern).
  path: "ops/call_agent/state/state.json"
  # Cap on remembered processed call IDs (oldest dropped first).
  max_processed_ids: 5000
