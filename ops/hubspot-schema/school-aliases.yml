# Canonical charter-school names for every place a school is spelled by hand:
# the free-text deal field `student_school`, the contact intake enumeration
# `charter_school_teacher` (its LABELS), and teacher email domains.
#
# Why this file exists (Roman 2026-09-02): 2,377 charter deals since Aug 2025
# carry 50 raw spellings of ~25 schools; 1,494 of them (63%) are iLEAD under 14
# spellings. `student_school` stays free text because po_inbox writes whatever
# the PO says (deal_property_map, locked rules 11-12) — so the fix is a lookup
# every consumer shares, not an enum that would break those writes.
#
# DECISION (Roman 2026-09-02): iLEAD is ONE bucket. Exploration / Hybrid /
# Antelope Valley / Lancaster / Agua Dulce / "California Charters" all
# canonicalise to "iLEAD". Everything else stays at school level; `network`
# is informational (it lets a future list roll IEM or PCI schools up without
# a new decision). IEM and Pacific Charter Institute ALSO exist as canonical
# buckets of their own, because their central-office staff (ieminc.org,
# pacificcharters.org) serve several schools and cannot be pinned to one.
#
# Matching is exact after lower-casing and collapsing whitespace — NOT fuzzy.
# A spelling that is not listed here is reported by the consumer, never guessed,
# so this file stays complete. Add the raw spelling under the right school.
#
# Every `domains:` entry was verified two ways on 2026-09-02 ("assume nothing"):
# the contacts' intake label agreed with the domain 100%, and the domain's own
# website title named the school. Vendors (e.g. mrdmath.com) are deliberately
# absent — a vendor is not a school.
#
# Consumers: scripts/teacher_school_stamp.py (first), scripts/charter_gap_*.py
# (next). Load with `load_school_aliases()` from scripts/teacher_school_stamp.py.

schools:
  - canonical: iLEAD
    network: iLEAD
    aliases:
      - iLEAD
      - iLead
      - ILEAD
      - ilead
      - Charter - iLEAD
      - iLEAD California Charters
      - iLEAD California Charter
      - LEAD California Charters
      - iLead Exploration
      - iCC1 for iLEAD Hybrid Exploration
      - iLEAD Antelope Valley
      - iLead Antelope Valley
