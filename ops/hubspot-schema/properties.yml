# ops/hubspot-schema — the property registry.
# Custom HubSpot properties the fleet depends on. If an agent writes a custom
# property, it must be declared here — create_properties.py syncs this file
# INTO the portal (create missing groups/properties, add missing enum
# options; never deletes, never touches HubSpot-defined properties).
#
# Keys per property mirror the HubSpot property API:
#   name / label / type / fieldType / description / options
# Fleet extensions:
#   options_from: registry  — enum options generated from registry.yml agent
#                             ids (value = id, label = human name, #AP014),
#                             merged with any literal `options` below it.
#
# Run: python3 create_properties.py --dry-run   (see README.md)

groups:
  tickets:
    - name: fleet_automation
      label: Fleet automation
  contacts:
    - name: master
      label: Master
    - name: decisionmaker
      label: Decision Maker/Director
    - name: tor
      label: Teacher of Record/EF/ES
    - name: family
      label: Family
    - name: tutor
      label: Tutors
    - name: student
      label: Student
    - name: events
      label: Events

properties:
  tickets:
    # #AP007 conventions: tickets filed by automations carry ticket_source +
    # source_agent so the re-ping ladder can filter and report by origin.
    # First consumer: the Feedback Agent (ops/feedback-agent) —
    # ticket_source=agent_feedback, source_agent=<registry id>.
    - name: ticket_source
      label: Ticket source
      group: fleet_automation
      type: enumeration
      fieldType: select
      description: >-
        Which fleet mechanism created this ticket. Set by automations, not
        humans. Declared in aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: agent_feedback
          label: "Agent feedback (#agent-feedback)"
        - value: call_agent
          label: "Call agent"
        - value: email_engine
          label: "Email engine"

    - name: source_agent
      label: Source agent
      group: fleet_automation
      type: enumeration
      fieldType: select
      description: >-
        The registered agent this ticket is about (registry.yml is the
        vocabulary). Set by automations, not humans. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options_from: registry
      options:
        - value: UNKNOWN
          label: "Unregistered automation"

  contacts:
    - name: sms_opt_out
      label: "SMS Opt Out"
      group: master
      type: enumeration
      fieldType: booleancheckbox
      description: >-
        Contact asked not to receive SMS (STOP reply or verbal request).
        Honored by ops/messenger (bulk SMS skips these). Set manually until
        the STOP-reply ingestion phase lands.
    - name: a_persona
      label: "A+ PERSONA"
      group: master
      type: enumeration
      fieldType: checkbox   # multi-select: a contact can be more than one persona (#AP030, e.g. TOR who is also a Family)
      description: >-
        Master contact-type switch for the 5-persona model. Every agent reads
        this FIRST to know who a contact is, before any persona-specific logic.
        Read the LABEL, not the internal value.
      options:
        - value: "Decision Maker/Director"
          label: "Decision Maker/Director"
        - value: "Teacher of Record/EF/ES"
          label: "Teacher of Record/EF/ES"
        - value: "Family"
          label: "Family"
        - value: "Tutors"
          label: "Tutors"
        - value: "Student"
          label: "Student"

