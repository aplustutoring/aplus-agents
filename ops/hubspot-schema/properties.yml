    # ── Events (booth capture) ──
    # First consumer: Sage Oak BTSC 2026 photo booth. aplus_event_tag is the
    # cross-event attendance marker — future events APPEND options here (the
    # sync is additive, so relabel/removal never happens from this file).
    - name: aplus_event_tag
      label: "Event Tag"
      group: events
      type: enumeration
      fieldType: checkbox   # multi-select: a contact can attend more than one event
      description: >-
        Which A+ events this contact attended. Set by event capture tools
        (photo booth, check-in), not humans. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: sage_oak_btsc_2026
          label: "Sage Oak BTSC 2026"
        - value: blue_ridge_btsc_2026
          label: "Blue Ridge BTSC 2026"
    - name: aplus_booth_goal
      label: "Booth Photo Banner"
      group: events
      type: string
      fieldType: text
      description: >-
        Banner text the attendee chose on their booth photo. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
    - name: aplus_booth_delivery
      label: "Booth Photo Delivery"
      group: events
      type: enumeration
      fieldType: select
      description: >-
        How the attendee wants their booth photo delivered. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: email
          label: "Email"
        - value: print
          label: "Print"
        - value: both
          label: "Both"    # legacy (pre-Text); booth now sends "all"
        - value: text
          label: "Text"
        - value: all
          label: "All"     # email + text + print
    - name: aplus_event_role
      label: "Event Role"
      group: events
      type: enumeration
      fieldType: select
      description: >-
        Attendee's self-identified role at the event, for segmentation.
        Set by event capture tools. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: administrator
          label: "Administrator"
        - value: teacher
          label: "Teacher"
        - value: support_staff
          label: "Support Staff"
        # Blue Ridge BTSC 2026 opened the booth to families, not just school
        # staff (Sage Oak was teachers only). Appended, never renamed — the
        # three above stay exactly as they are.
        - value: parent
          label: "Parent"
        - value: student
          label: "Student"
    - name: aplus_booth_photo_url
      label: "[Agent] Booth Photo URL"
      group: events
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by the booth Worker (booth/worker.js photo
        archive) and the event-photo backfill, do not edit by hand. Public URL
        of the contact's framed booth photo, used as the personalization token
        in event follow-up emails.
    # EVENT-TEMP — Blue Ridge BTSC 2026 prize wheel only. Deliberately NOT in
    # KEEPERS.md: it is single-event capture, not part of the agent vocabulary,
    # and it should be reviewed for archive once the event is reconciled.
    # aplus_booth_goal was NOT reused for this — that is photo-banner text and
    # overloading it would corrupt the Sage Oak capture.
    - name: aplus_booth_prize
      label: "[Agent] Booth Prize Won"
      group: events
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by booth/blue-ridge/worker.js. Which prize the
        visitor landed on at the Blue Ridge BTSC 2026 spin wheel. EVENT-TEMP:
        single-event capture, not a keeper. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
    - name: aplus_marketing_consent
      label: "Booth Marketing Consent"
      group: events
      type: enumeration
      fieldType: select
      description: >-
        Opted into A+ resources at the booth. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: "true"
          label: "Yes"
        - value: "false"
          label: "No"

