# ops/hubspot-schema — the property registry.
# Custom HubSpot properties the fleet depends on. If an agent writes a custom
# property, it must be declared here — create_properties.py syncs this file
# INTO the portal (create missing groups/properties, add missing enum
# options; never deletes, never touches HubSpot-defined properties).
#
# Keys per property mirror the HubSpot property API:
#   name / label / type / fieldType / description / options
# Fleet extensions:
#   options_from: registry  — enum options generated from registry.yml agent
#                             ids (value = id, label = human name, #AP014),
#                             merged with any literal `options` below it.
#
# Run: python3 create_properties.py --dry-run   (see README.md)

groups:
  tickets:
    - name: fleet_automation
      label: Fleet automation
    - name: tutor
      label: Tutor
    - name: review
      label: Review
  deals:
    - name: retention              # the retention journey lives on the deal (HubSpot is the list; Monday retired)
      label: Retention journey
  contacts:
    - name: master
      label: Master
    - name: decisionmaker
      label: Decision Maker/Director
    - name: tor
      label: Teacher of Record/EF/ES
    - name: family
      label: Family
    - name: tutor
      label: Tutors
    - name: student
      label: Student
    - name: events
      label: Events

properties:
  tickets:
    # #AP007 conventions: tickets filed by automations carry ticket_source +
    # source_agent so the re-ping ladder can filter and report by origin.
    # First consumer: the Feedback Agent (ops/feedback-agent) —
    # ticket_source=agent_feedback, source_agent=<registry id>.
    - name: ticket_source
      label: Ticket source
      group: fleet_automation
      type: enumeration
      fieldType: select
      description: >-
        Which fleet mechanism created this ticket. Set by automations, not
        humans. Declared in aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: agent_feedback
          label: "Agent feedback (#agent-feedback)"
        - value: call_agent
          label: "Call agent"
        - value: email_engine
          label: "Email engine"
        - value: tutor_issues
          label: "Tutor issues (ops/tutor-issues)"

    - name: source_agent
      label: Source agent
      group: fleet_automation
      type: enumeration
      fieldType: select
      description: >-
        The registered agent this ticket is about (registry.yml is the
        vocabulary). Set by automations, not humans. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options_from: registry
      options:
        - value: UNKNOWN
          label: "Unregistered automation"

    # ── PO-inbox work type (Roman approved 2026-08-27).
    # Every ticket the PO inbox filed was stamped hs_ticket_category=new_deal_po,
    # including the 42 of 93 whose own description read "Not a PO:". Measured over
    # 845 tickets since 2026-06-01, a ticket carrying a real category closed in a
    # median of 0.25 days at a 92% rate; one in the catch-all took 2.15 days at
    # 80%. The extractor already works the type out and writes it in prose — this
    # is where it goes so routing, SLA and a done-state can key off it.
    - name: po_work_type
      label: "[Agent] PO inbox work type"
      group: fleet_automation
      type: enumeration
      fieldType: select
      description: >-
        AGENT PROPERTY — written by email/src/po_inbox.py. What a charter@ inbox
        ticket actually is, as opposed to hs_ticket_category which only has a
        coarse New Deal / PO option. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: purchase_order
          label: "Purchase order"
        - value: po_cancellation
          label: "PO cancellation"
        - value: ar_followup
          label: "AR follow-up / reconciliation"
        - value: invoice_correction
          label: "Invoice correction / reissue"
        - value: vendor_compliance
          label: "Vendor compliance (agreement, COI, W-9)"
        - value: vendor_onboarding
          label: "Vendor onboarding / renewal"
        - value: parent_info_reply
          label: "Parent info reply"
        - value: family_inquiry
          label: "Family inquiry"
        - value: marketing_junk
          label: "Marketing / junk"
        - value: scam
          label: "Suspected scam"
        - value: other
          label: "Other non-PO"

    # ── Tutor-issue ticketing (ops/tutor-issues, Roman approved 2026-08-26).
    # Tickets logged on the TUTOR's contact record when we notice an issue.
    # Silent internal log in v1 — nothing tutor-facing reads these.
    - name: tutor_issue_type
      label: "[Agent] Tutor issue type"
      group: tutor
      type: enumeration
      fieldType: select
      description: >-
        AGENT PROPERTY — written by ops/tutor-issues/tutor_issues.py. Which
        of the five tutor-issue types this ticket logs. Types 1/3 are
        auto-detected from Teachworks; 2/4/5 come from structured intake or
        inbound family reports. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: missed_lesson_or_late
          label: "Missed lesson / late"
        - value: tutor_change_requested
          label: "Tutor change requested"
        - value: notes_not_completed
          label: "Lesson notes not completed"
        - value: scheduling_flip_flop
          label: "Scheduling flip-flop"
        - value: tech_issue_unreported
          label: "Tech issue not reported"

    - name: tutor_issue_source_ids
      label: "[Agent] Tutor issue source records"
      group: tutor
      type: string
      fieldType: textarea
      description: >-
        AGENT PROPERTY — written by ops/tutor-issues/tutor_issues.py. Audit
        trail: the system records that prove the issue — Teachworks lesson
        ids (tw:<acct>:<lesson_id>), HubSpot conversation/ticket ids
        (hsconv:<thread_id>, hsticket:<id>), JustCall SMS ids (jcsms:<id>),
        or Slack intake permalinks. One per line; recurrence appends.

    - name: tutor_issue_detected_at
      label: "[Agent] Tutor issue detected at"
      group: tutor
      type: datetime
      fieldType: date
      description: >-
        AGENT PROPERTY — written by ops/tutor-issues/tutor_issues.py. When
        the FIRST qualifying event behind this ticket was detected (UTC).

    - name: tutor_issue_last_event_at
      label: "[Agent] Tutor issue last event at"
      group: tutor
      type: datetime
      fieldType: date
      description: >-
        AGENT PROPERTY — written by ops/tutor-issues/tutor_issues.py. When
        the most recent qualifying event was detected (UTC). Recurrence
        updates this instead of opening a second ticket.

    - name: tutor_issue_occurrences
      label: "[Agent] Tutor issue occurrences"
      group: tutor
      type: number
      fieldType: number
      description: >-
        AGENT PROPERTY — written by ops/tutor-issues/tutor_issues.py. How
        many qualifying events this ticket has absorbed (dedupe rule: one
        open ticket per tutor per issue type per period).

    - name: tutor_issue_period
      label: "[Agent] Tutor issue period"
      group: tutor
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by ops/tutor-issues/tutor_issues.py. The
        dedupe period key this ticket covers — ISO week (e.g. 2026-W35) for
        the weekly Teachworks detectors, rolling-30d anchor date for the
        report-driven types.

    # ── Review tickets (email engine, Roman approved 2026-08-26). A ticket
    # tied to the FAMILY contact when a review-notification email arrives
    # (Google/Yelp), so reviews are trackable on the board.
    - name: review_platform
      label: "[Agent] Review platform"
      group: review
      type: enumeration
      fieldType: select
      description: >-
        AGENT PROPERTY — written by email/src/main.py (triage,
        review_received category). Which platform the review landed on.
      options:
        - value: google
          label: "Google"
        - value: yelp
          label: "Yelp"
        - value: other
          label: "Other"

    - name: review_rating
      label: "[Agent] Review rating"
      group: review
      type: number
      fieldType: number
      description: >-
        AGENT PROPERTY — written by email/src/main.py (triage,
        review_received category). Star rating (1-5) when the notification
        states it; unset when unknown.

    - name: review_reviewer_name
      label: "[Agent] Review reviewer name"
      group: review
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by email/src/main.py (triage,
        review_received category). Reviewer display name as the platform
        shows it (may be partial, e.g. "Maria A."). The family association
        is only made on an exact unique contact match; this field preserves
        the raw name either way.


  contacts:
    # ── LABEL CONVENTION (Roman 2026-08-14): every property an AGENT writes
    # carries the "[Agent] " label prefix + a description naming the writer,
    # so humans in the portal can tell agent-maintained fields from intake
    # capture at a glance. Applies to new declarations; existing agent props
    # were relabeled in-portal the same day (sync never relabels).
    - name: sms_opt_out
      label: "[Agent] SMS Opt Out"
      group: master
      type: enumeration
      fieldType: booleancheckbox
      description: >-
        AGENT PROPERTY — read by ops/messenger (bulk SMS skips these);
        set by the STOP-reply ingestion once it lands, manual until then.
        Contact asked not to receive SMS (STOP reply or verbal request).
      options:
        - value: "true"
          label: "Yes"
        - value: "false"
          label: "No"
    - name: a_persona
      label: "A+ PERSONA"
      group: master
      type: enumeration
      fieldType: checkbox   # multi-select: a contact can be more than one persona (#AP030, e.g. TOR who is also a Family)
      description: >-
        Master contact-type switch for the 5-persona model. Every agent reads
        this FIRST to know who a contact is, before any persona-specific logic.
        Read the LABEL, not the internal value.
      options:
        - value: "Decision Maker/Director"
          label: "Decision Maker/Director"
        - value: "Teacher of Record/EF/ES"
          label: "Teacher of Record/EF/ES"
        - value: "Family"
          label: "Family"
        - value: "Tutors"
          label: "Tutors"
        - value: "Student"
          label: "Student"

    # ── Consolidation keepers (approved by Roman 2026-08-10) ──
    # Registry declarations for the agent property vocabulary (KEEPERS.md).
    # Options intentionally omitted on enums: the PORTAL stays authoritative
    # for option lists/labels (e.g. the master school list) — the additive
    # sync then never adds or relabels options on these.
    # — family —
    - name: charter_school_family_
      label: "Charter School Family?"
      group: family
      type: enumeration
      fieldType: booleancheckbox
    - name: last_tutor_name
      label: "[Agent] Last Tutor Name"
      group: family
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by scripts/charter_gap_analysis.py
        (--write-props), do not edit by hand. FIRST NAME of the tutor on
        the family's most recent COMPLETED Teachworks lesson
        (customer-facing — no last names, Roman 2026-08-14). Distinct
        from the deal-level assigned_tutor intake field.
    - name: student_first_name
      label: "[Agent] Student First Name"
      group: family
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by scripts/charter_gap_analysis.py
        alongside last_tutor_name, do not edit by hand. Student on the
        family's most recent COMPLETED Teachworks lesson. NOTE: a deal
        property with the same name exists (dealinformation intake
        capture) — this is the contact-level counterpart.
    - name: last_tutor_active
      label: "[Agent] Last Tutor Active"
      group: family
      type: enumeration
      fieldType: booleancheckbox
      description: >-
        AGENT PROPERTY — written by scripts/tw_tutor_active_check.py, do not
        edit by hand. Whether the tutor in last_tutor_name is still an ACTIVE
        Teachworks employee (both accounts). Outreach must NOT name an
        inactive tutor (Roman 2026-08-17: "Ruth does not tutor with us").
      options:
        - value: "true"
          label: "Yes"
        - value: "false"
          label: "No"
    - name: student_names
      label: "[Agent] Student Names"
      group: family
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by scripts/charter_gap_analysis.py, do not
        edit by hand. ALL students named across the family's charter deals
        since Aug 2025, formatted for prose ("Brooke, Haven & Lillie"), so
        multi-student families get every child named in outreach.
    - name: student_count
      label: "[Agent] Student Count"
      group: family
      type: number
      fieldType: number
      description: >-
        AGENT PROPERTY — written by scripts/charter_gap_analysis.py, do not
        edit by hand. Number of distinct students across the family's charter
        deals since Aug 2025 (drives 1-vs-multi segmentation).
    - name: charter_winback_replied
      label: "[Agent] Charter Win-back Replied"
      group: family
      type: enumeration
      fieldType: booleancheckbox
      description: >-
        AGENT PROPERTY — set to true when a charter win-back campaign contact
        replies (Conversations inbox hook + email agent). Workflow exit goal
        for the win-back sequences so repliers never get the follow-up nudge.
      options:
        - value: "true"
          label: "Yes"
        - value: "false"
          label: "No"
    - name: campaign_replied
      label: "[Agent] Campaign Replied"
      group: master
      type: enumeration
      fieldType: booleancheckbox
      description: >-
        AGENT PROPERTY — written by email/src/main.py (stamp_campaign_reply)
        when the info@ classifier files a reply as campaign_school or
        campaign_family. Yes means this contact replied to a campaign send by
        email, even when the reply landed at info@ and never touched
        hs_email_last_reply_date. Sequences and workflows exit on it; reports
        count it. Persona-agnostic (teachers and families), hence master group.
        Roman 2026-09-04, teacher outreach 26/27.
      options:
        - value: "true"
          label: "Yes"
        - value: "false"
          label: "No"
    - name: agent_last_outbound_at
      label: "[Agent] Last Outbound At"
      group: master
      type: datetime
      fieldType: date
      description: >-
        AGENT PROPERTY — written by email/src/presend.py (record_send) after
        every agent-sent text or email to this contact, on any line. The
        pre-send gate reads it to hold a second touch inside min_gap_hours
        unless the contact wrote first. Persona-agnostic, hence master.
        Roman 2026-09-09, after the Gonzalez double-thread.
    - name: agent_last_outbound_seat
      label: "[Agent] Last Outbound Seat"
      group: master
      type: enumeration
      fieldType: select
      description: >-
        AGENT PROPERTY — written by email/src/presend.py (record_send). The
        line or seat the last agent outbound went from, so a human can see at
        a glance which side of the house last spoke to this contact.
      options:
        - value: charter_sales
          label: "charter_sales line (Paola)"
        - value: support
          label: "support line (schedulers)"
        - value: sales
          label: "sales line"
        - value: conference
          label: "main line"
        - value: email
          label: "email"
    - name: agent_last_inbound_at
      label: "[Agent] Last Inbound At"
      group: master
      type: datetime
      fieldType: date
      description: >-
        AGENT PROPERTY — written by email/src/presend.py (stamp_last_inbound)
        when the fleet observes the contact writing to us: an INCOMING inbox
        message (stamped by email/src/main.py) or an inbound text seen by the
        gate. Exists because hs_email_last_reply_date is never set by inbox
        replies; lists and workflows can use this one.
    - name: teacher_of_record_name
      label: "Teacher of Record Name"
      group: family
      type: string
      fieldType: text
    - name: teacher_of_record_email_address
      label: "Teacher of Record Email Address"
      group: family
      type: string
      fieldType: text
    - name: how_did_you_hear_about_us_
      label: "How Did You Hear About Us?"
      group: family
      type: enumeration
      fieldType: select
    - name: referral_name
      label: "Referral Name"
      group: family
      type: string
      fieldType: text
    - name: parent_concerns_what_can_we_do_to_help_
      label: "What's going on?"
      group: family
      type: string
      fieldType: textarea
    - name: what_is_your_child_s_current_grade_level_
      label: "What grade is your child in?"
      group: family
      type: enumeration
      fieldType: select
    - name: parent_email
      label: "Parent Email"
      group: family
      type: string
      fieldType: text
    - name: parent_first_name
      label: "Parent First Name"
      group: family
      type: string
      fieldType: text
    - name: parent_last_name
      label: "Parent Last Name"
      group: family
      type: string
      fieldType: text
    - name: parent_phone_number
      label: "Parent Phone Number"
      group: family
      type: string
      fieldType: text
    - name: subject_need
      label: "Subject Need"
      group: family
      type: enumeration
      fieldType: radio
    - name: online_or_in_person
      label: "Online or In Person Preference"
      group: family
      type: enumeration
      fieldType: select
    - name: student_school
      label: "Student School"
      group: family
      type: string
      fieldType: text
    - name: student_additional_information
      label: "What we can do to help"
      group: family
      type: string
      fieldType: textarea
    - name: student_full_name_clone_
      label: "Student 2 Full Name"
      group: family
      type: string
      fieldType: text
    - name: student_3_full_name
      label: "Student 3 Full Name"
      group: family
      type: string
      fieldType: text
    - name: student_4_full_name
      label: "Student 4 Full Name"
      group: family
      type: string
      fieldType: text
    # — tor —
    - name: educational_facillitator_teacher_of_record
      label: "Educational Facillitator/Teacher of Record"
      group: tor
      type: enumeration
      fieldType: booleancheckbox
    - name: charter_school_teacher
      label: "Charter School Teacher"
      group: tor
      type: enumeration
      fieldType: select
    - name: last_tor_workflow_enrollment_date
      label: "Last TOR Workflow Enrollment Date"
      group: tor
      type: date
      fieldType: date
    - name: school_canonical
      label: "[Agent] School"
      group: tor
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by scripts/teacher_school_stamp.py, do not
        edit by hand. Canonical charter school for a TEACHER contact, derived
        from the charter deals the teacher is named on (teacher_of_record_email
        → student_school) and normalised through
        ops/hubspot-schema/school-aliases.yml. iLEAD is ONE bucket (Roman
        2026-09-02). Falls back to the intake enumeration charter_school_teacher (LABEL), then a verified email domain; disagreements are reported.
        Distinct from the family intake field student_school.
    - name: generic_inbox
      label: "[Agent] Generic Inbox"
      group: tor
      type: enumeration
      fieldType: booleancheckbox
      description: >-
        AGENT PROPERTY — written by scripts/teacher_school_stamp.py, do not
        edit by hand. Yes when the contact is a shared/role mailbox at a
        school (purchasing@, invoices@, studentservices@, info@, noreply@ …)
        rather than a person. Set from the email local-part. Teacher outreach
        lists must EXCLUDE these (Roman 2026-09-02: "keep generic inboxes
        separate"); PO/invoice routing may still want them.
      options:
        - value: "true"
          label: "Yes"
        - value: "false"
          label: "No"
    # — tutor —
    - name: tutor_roster_status
      label: "[Agent] Tutor Roster Status"
      group: tutor
      type: enumeration
      fieldType: select
      description: >-
        AGENT PROPERTY — written by scripts/tutor_roster_check.py, do not edit
        by hand. Ground truth for tutor liveness (Roman 2026-08-25): matched
        by email against the Teachworks EMPLOYEE roster in BOTH accounts.
        Active in either account = Active. HubSpot lead status
        "Tutor-Active" is a hint only; this field wins.
      options:
        - value: "Active (online)"
          label: "Active (online)"
        - value: "Active (in person)"
          label: "Active (in person)"
        - value: "Active (both)"
          label: "Active (both)"
        - value: "Inactive (both)"
          label: "Inactive (both)"
        - value: "Not found"
          label: "Not found"
    - name: a__pay_per_hour
      label: "A+ Pay Per Hour"
      group: tutor
      type: number
      fieldType: number
    - name: resume
      label: "Resume"
      group: tutor
      type: string
      fieldType: file
    - name: tutor_profile
      label: "Tutor Profile"
      group: tutor
      type: string
      fieldType: textarea
    - name: online_in_person_
      label: "Online or In-Person"
      group: tutor
      type: enumeration
      fieldType: select
    - name: select_days_for_availability
      label: "Select Days for Availability"
      group: tutor
      type: enumeration
      fieldType: checkbox
    - name: what_subjects_do_you_feel_the_most_qualified_to_tutor_
      label: "What subjects do you feel the most qualified to tutor?"
      group: tutor
      type: enumeration
      fieldType: checkbox
    - name: completed_tutor_training
      label: "Completed Tutor Training"
      group: tutor
      type: bool
      fieldType: booleancheckbox
    # — student —
    - name: student_email_address
      label: "Student Email Address"
      group: student
      type: string
      fieldType: text
    - name: student_last_name
      label: "Student FIRST Name"
      group: student
      type: string
      fieldType: text
    - name: student_last_name_if_diff_from_parent
      label: "Student Last Name"
      group: student
      type: string
      fieldType: text
    # — grade (program capture) —
    - name: grade_level
      label: "Grade Level"
      group: contactinformation
      type: string
      fieldType: text
    - name: spotlight_grade_level
      label: "Spotlight Grade Level"
      group: spotlight
      type: enumeration
      fieldType: select
    - name: teacher_scholarship_nomination__student_1__student_grade_level
      label: "Teacher Scholarship Nomination - Student 1 - Student Grade Level"
      group: contactinformation
      type: enumeration
      fieldType: select
    - name: teacher_scholarship_nomination__student_2__student_grade_level
      label: "Teacher Scholarship Nomination - Student 2 - Student Grade Level"
      group: contactinformation
      type: enumeration
      fieldType: select
    - name: teacher_scholarship_nomination__student_3__student_grade_level
      label: "Teacher Scholarship Nomination - Student 3 - Student Grade Level"
      group: contactinformation
      type: enumeration
      fieldType: select

    # ── Events (booth capture) ──
    # First consumer: Sage Oak BTSC 2026 photo booth. aplus_event_tag is the
    # cross-event attendance marker — future events APPEND options here (the
    # sync is additive, so relabel/removal never happens from this file).
    - name: aplus_event_tag
      label: "Event Tag"
      group: events
      type: enumeration
      fieldType: checkbox   # multi-select: a contact can attend more than one event
      description: >-
        Which A+ events this contact attended. Set by event capture tools
        (photo booth, check-in), not humans. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: sage_oak_btsc_2026
          label: "Sage Oak BTSC 2026"
        - value: eo_lav_agents_2026
          label: "EO LA Valley AI Agents 2026"
        - value: blue_ridge_btsc_2026
          label: "Blue Ridge BTSC 2026"
    - name: aplus_booth_goal
      label: "Booth Photo Banner"
      group: events
      type: string
      fieldType: text
      description: >-
        Banner text the attendee chose on their booth photo. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
    - name: aplus_booth_delivery
      label: "Booth Photo Delivery"
      group: events
      type: enumeration
      fieldType: select
      description: >-
        How the attendee wants their booth photo delivered. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: email
          label: "Email"
        - value: print
          label: "Print"
        - value: both
          label: "Both"    # legacy (pre-Text); booth now sends "all"
        - value: text
          label: "Text"
        - value: all
          label: "All"     # email + text + print
    - name: aplus_event_role
      label: "Event Role"
      group: events
      type: enumeration
      fieldType: select
      description: >-
        Attendee's self-identified role at the event, for segmentation.
        Set by event capture tools. Declared in
        aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: administrator
          label: "Administrator"
        - value: teacher
          label: "Teacher"
        - value: support_staff
          label: "Support Staff"
        # Blue Ridge BTSC 2026 opened the booth to families, not just school
        # staff (Sage Oak was teachers only). Appended, never renamed — the
        # three above stay exactly as they are.
        - value: parent
          label: "Parent"
        - value: student
          label: "Student"
    - name: aplus_booth_photo_url
      label: "[Agent] Booth Photo URL"
      group: events
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by the booth Worker (booth/worker.js photo
        archive) and the event-photo backfill, do not edit by hand. Public URL
        of the contact's framed booth photo, used as the personalization token
        in event follow-up emails.
