        the family's most recent COMPLETED Teachworks lesson
        (customer-facing — no last names, Roman 2026-08-14). Distinct
        from the deal-level assigned_tutor intake field.
    - name: student_first_name
      label: "[Agent] Student First Name"
      group: family
      type: string
      fieldType: text
      description: >-
        AGENT PROPERTY — written by scripts/charter_gap_analysis.py
