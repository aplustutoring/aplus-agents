    - name: retention_stage
      label: "[Agent] Retention stage"
      group: retention
      type: enumeration
      fieldType: select
      description: >-
        AGENT PROPERTY — written by email/src/low_balance.py. Where the family
        is in the retention journey. Low Hours = Teachworks alerted at 4 hours
        or fewer and the day-0 email went; Family Contacted = day-1 text;
        Teacher Contacted = day-1 teacher draft; Retention Risk = no PO after
        7 days; Renewed = the next PO/package deal appeared; Not Renewing =
        deal moved to Stopped; Lost = 21 days of silence after the risk flag.
        Declared in aplus-agents/ops/hubspot-schema/properties.yml.
      options:
        - value: active
          label: "Active"
        - value: low_hours
          label: "Low Hours"
