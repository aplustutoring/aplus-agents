# ops/feedback-agent — Feedback Agent v1 configuration
# Secrets live in env vars (repo secrets on Actions) — never here.

# The manifest is the vocabulary: reports are classified against these agents,
# and anything that maps to none of them is UNKNOWN (possible shadow
# automation -> Zapier census input).
registry_path: "registry.yml"

# Where structured corrections land: corrections/<agent>/YYYY-MM-DD-<slug>.md,
# opened as PRs (draft probation — Roman merges).
corrections_dir: "corrections"

slack:
  # The one channel for the whole fleet: #agent-feedback (created 2026-07-27,
  # PRIVATE — enforces staff-only for v1; tutors' path stays through Mandy
  # until this agent graduates and Roman revisits). Channel ID, not name:
  # private channels don't resolve by name for bot posts. The aplus bot must
  # be /invite'd.
  channel: "C0BL05MCJ4B"
  # Slack member IDs (Uxxxxxxxx) for pings (verified against the workspace
  # 2026-07-27). If either is blank the agent falls back to a plain name.
  people:
    emily: "U05MXK1MC5Q"      # Emily Shulman
    roman: "U05NA7UMSSV"      # Roman Slavinsky
    danielle: "U05NMABF3B2"   # Danielle Brodetsky
    paola: "U094B5DRZBR"      # Paola Sarmiento
  # Who receives operational pings: ticket drafts, DEMOTE alerts, and the
  # digest's demotion-review flags. Kept narrow on purpose — pinging four
  # people on every proposal trains everyone to ignore the pings.
  alerts_to: ["roman"]
  # Who may APPROVE a fix proposal and MERGE the resulting PR by replying in
  # the thread. Falls back to alerts_to when unset (the pre-2026-08-20
  # behavior). Deliberately wider than alerts_to: Roman 2026-08-20 — "i want it
  # that danielle or paola or emily could do the approve and merges".
  #
  # The natural case this unlocks: whoever REPORTS a problem can approve its
  # fix. Paola reports the missing reel, Paola approves the fix, Paola merges
  # it — no round trip through Roman for work she is closest to.
  #
  # What this grants: firing the coding agent, and squash-merging its PR to
  # main. What it does NOT grant: DEMOTE registry flips, which stay with Roman
  # until a Fleet Manager exists to verify state changes.
  approvers: ["roman", "danielle", "paola", "emily"]

intake:
  # Channel furniture is not a report. On 2026-08-20 the channel's own pinned
  # "How this channel works" post was itself filed as an IDEA against the
  # feedback agent (thread 1787258667.896529) — it arrives as an ordinary human
  # message, so nothing upstream drops it. These are deterministic checks (no
  # Claude call, same reasoning as the status keyword match): a genuine report
  # must never be swallowed by a fuzzy "looks like boilerplate".
  ignore:
    # Distinctive phrases from the pinned how-to-use post. Matched
    # case-insensitively against the message text.
    meta_markers:
      - "How this channel works"
      - "What it's for:"
      - "How to report:"
      - "What happens next"
      - "Reply in that thread with one word"
      - "Every Friday there's a digest"
      - "Nothing ships without one of us saying"
    # How many DISTINCT markers must hit before a message is treated as the
    # instructions rather than a complaint. Two, so quoting one line of the
    # pinned post while reporting a real problem still files normally.
    min_marker_hits: 2
    # Slack apps/workflows whose posts are never reports — the ID in the
    # "*Sent using* <@…>" attribution at the bottom of a message.
    #
    # DELIBERATELY EMPTY. The obvious candidate, U0AKFN28V1U, is NOT a workflow
    # bot: it is the attribution Roman's Slack client appends to everything he
    # types, including real reports (the content-build carousel overflow report
    # 2026-08-04, the call-agent exit-code report 2026-08-20) and even his
    # "status" queries. Listing it here would silently swallow every report
    # Roman files. Only add an ID you have confirmed posts nothing but notices.
    sender_app_ids: []

claude:
  # Repo-standard model (matches ops/call_agent + marketing/scripts/*).
  model: "claude-opus-4-7"
  max_tokens: 1500
  # The analysis stage (diagnosis + fix plan proposed for approval) gets more
  # room than classification.
  analysis_max_tokens: 2500

hubspot:
  # BROKEN / critical reports become tickets per #AP007 conventions
  # ([AGENT] title, ticket_source=agent_feedback, source_agent=<id>) so they
  # enter the re-ping ladder. Draft probation: the payload is posted in-thread
  # for the approver (slack.alerts_to) to execute; after graduation the agent creates it directly.
  # `ticket_source` and `source_agent` are custom ticket properties, created
  # 2026-07-27 and declared in ops/hubspot-schema/properties.yml (re-run that
  # sync when a new agent registers, so the source_agent enum stays current).
  ticket:
    pipeline: "0"           # Support Pipeline (same as call agent)
    stage: "131537027"      # "Working on it"
    priority: "MEDIUM"      # critical severity upgrades to HIGH

probation:
  # draft: corrections open as PRs, tickets are drafted in-thread, the DEMOTE
  # registry flip is opened as a one-click PR that a human merges.
  # autonomous (after graduation): classification+filing act directly; the
  # DEMOTE flip STAYS human-executed until the Fleet Manager exists to verify
  # state changes.
  stage: draft
  # Graduation bar (#AP011 scaling): clean reports = correction PRs merged
  # without human edits. Tracked in state, reported in the Friday digest.
  clean_reports_target: 20

digest:
  # Any agent with >= threshold WRONG/ANNOYING reports inside the window is
  # flagged as a demotion-review candidate for the demotion ledger. Digests
  # aggregate by agent, never by person — the scoreboard tracks agents.
  review_threshold: 3
  review_window_days: 14

state:
  # Repo-relative; committed back by the workflows (call-agent pattern).
  path: "ops/feedback-agent/state/state.json"
  # Friday digest is also written here — input to the Integrator's Monday brief.
  digest_path: "ops/feedback-agent/state/digest-latest.md"
  max_processed_ids: 2000
