# Charter TEACHER (TOR) outreach from Danielle. See CAMPAIGN-TOR-2026-08.md.
# The teacher-side counterpart to campaign.yml (families, from Paola).
# Kept in a SEPARATE file so arming this never touches the live family campaign.
#
# Run: python3 ops/messenger/enroll.py --config campaign-tor.yml
#
# HARD COMPLIANCE RULES (Roman 2026-08-25, locked). Every template obeys these:
#   1. The Badge denotes quality of program DESIGN only. Not implementation,
#      not effectiveness.
#   2. No copy may imply Stanford validated our student outcomes.
#   3. Never: certified, accredited, endorsed, approved provider.
#   4. No numbers about students. No counts, percentages, or outcome data.
#   5. No em dashes, ever.
#   6. Student-centered voice. Thank teachers for trusting us with STUDENTS,
#      never for sending business.
#   7. Text only. No Badge image in email.
#
# STRUCTURE (Roman 2026-08-25, locked): one campaign, four tiers, one shared
# Badge paragraph. What changes per tier is the opening move and how hard the
# ask is. Segmentation is by RELATIONSHIP HISTORY, not by volume sent last year.
# The old 5+ / 2-4 / 1 split is RETIRED.
armed: false
launch_date: ""
timezone: America/Los_Angeles
send_from:
  role: sales                 # roles-not-names: email/config.yaml roles.sales
  hubspot_owner_id: "227538487"
  from_name: "Danielle Brodetsky"
  reply_to: "danielle@wetutorathome.com"
  task_owner_role: sales

# list_id filled by scripts/charter_tor_segments.py --build-lists
# workflow_id/email_ids filled once the HubSpot build is approved.
enrollments:
  - segment: tier1_no_history
    tier: 1
    list_id: ""
    workflow_id: ""
    email_ids: []
    template: tier1_no_history.md
    audience: "674 mailable. No referral history, so no trust to reference."
    primary_cta: scholarship_nomination   # NOT a P.S. for this tier
    cadence: "Day 0 email, one follow-up"

  - segment: tier2_warm_reopen
    tier: 2
    list_id: ""
    workflow_id: ""
    email_ids: []
    template: tier2_warm_reopen.md
    audience: "45 mailable. Referred at some point, but not last year."
    primary_cta: caseload_ask
    cadence: "Day 0 email, one follow-up"
    note: "Warm reopen, NOT a thank-you. Name the gap rather than paper over it."

  - segment: tier3_last_year
    tier: 3
    list_id: ""
    workflow_id: ""
    email_ids: []
    template: tier3_last_year.md
    audience: >-
      169 mailable. Last year's referrers. Roman's spec says 193; that figure
      included the heavy referrers, who are now Tier 4 and pulled out.
    primary_cta: caseload_ask
    cadence: "Day 0 email, one follow-up"
    note: "Opening paragraph is LOCKED VERBATIM. Do not edit."

# TIER 4 IS NOT AN ENROLLMENT. 24 heavy referrers, pulled OUT of the campaign
