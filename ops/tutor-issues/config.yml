# ops/tutor-issues — Tutor-issue ticketing configuration
# Secrets live in env vars (repo secrets on Actions) — never here.
#
# Policy (Roman, approved 2026-08-26): issues we notice get logged as HubSpot
# tickets on the tutor's contact record. Silent internal log in v1 — the
# tutor is NEVER notified. Owner is the Operations role on every ticket.
# Detection is automated ONLY where system data proves it (Teachworks);
# everything else enters through structured intake or reasoned inbound
# reports, and an unresolvable tutor means NO ticket (refusal is a signal,
# a guess is a landmine).

registry_id: tutor-issues

hubspot:
  ticket:
    pipeline: "0"            # Support Pipeline (the only ticket pipeline)
    stage: "131537027"       # "Working on it" — opening stage for every tutor-issue ticket
    closed_stage: "4"        # "Done" — a ticket in this stage no longer absorbs recurrence
                             # (NOTE: "Stopped" has an isClosed gap Roman is fixing in-portal;
                             #  until then only Done counts as closed here)
    # hs_ticket_category is matched BY LABEL at runtime (enumeration rule:
    # agents read labels, never trust internal values).
    category_label: "Tutor Issue"
  # ROLES, not names (Roman 2026-08-14). role -> staff key; staff block is
  # the only home for people.
  roles:
    # ── THE ONE LINE TO CHANGE WHEN THE TUTOR QUALITY LEAD IS HIRED ──
    # Mandy left 2026-09-17. Emily holds the seat in the interim. Swap this
    # value when the Mexico-based Tutor Quality Lead starts.
    tutor_quality_owner: emily
    operations: emily        # ticket owner on EVERY tutor-issue ticket; was mandy until 2026-09-17
    fallback_scheduler: emily  # scheduler pings when the student (and so the A-L/M-Z split) is unknown

staff:
  # hubspot_owner_id verified against /crm/v3/owners 2026-08-26.
  # slack_id verified against the workspace 2026-08-26.
  # mandy REMOVED 2026-09-17 (terminated). Every ticket this engine created
  # between her departure and this change was assigned to a dead queue.
  emily:
    hubspot_owner_id: "39191217"
    slack_id: "U05MXK1MC5Q"
  janelle:
    hubspot_owner_id: "80047202"
    slack_id: "U08S3CG8XNY"
  yolanda:
    hubspot_owner_id: "86868539"
    slack_id: "U0A6XGBU7QT"
  roman:
    hubspot_owner_id: "38681249"
    slack_id: "U05NA7UMSSV"

# Scheduler split by STUDENT last-name initial — same rule as
# ops/scorecard/aplus_missed_lessons_sync.py (A-L Janelle, M-Z Yolanda).
schedulers:
  a_to_l: janelle
  m_to_z: yolanda

slack:
  # #tutor-issues (created 2026-08-26, PRIVATE, aplus bot invited — verified
  # via users.conversations). Channel ID, not name: private channels don't
  # resolve by name for bot posts. The engine refuses to send while empty.
  channel: "C0BSU4KGA0K"
  # Everything the engine says in Slack lands in this one channel:
  #  - the per-run ops digest (ONE message per run, never per-item DMs)
  #  - event-driven scheduler notifications for inbound family reports
  #    ("ticket created" / "couldn't auto-file, handle manually")
  #  - loud cap-exceeded / baseline notices
  mention_ops: true          # @-mention the operations role on the digest

detectors:
  # Week window is the last COMPLETE Sun-Sat week, evaluated after the
  # Sunday cutoff (the sweep runs Mondays).
  missed_lesson_or_late:
    # Statuses that prove a missed lesson, same set as
    # ops/scorecard/aplus_missed_lessons_sync.py NO_SHOW_STATUSES.
    # In Teachworks these are TUTOR-attributable only when the per-student
    # status says so; the sweep counts per-tutor events.
    no_show_statuses: ["no_show", "missed", "no show"]

    # OFF since 2026-09-10. A Teachworks participant status says THIS STUDENT
    # did not attend. It does not say why, and cannot separate a student who
    # flaked from a tutor who never showed. Every event that ever produced a
    # ticket here was a student marked "missed", and 5 of the 12 tutors those
    # tickets named are rated Highly Effective on every dimension of their real
    # evaluation (Monday board 8900831153). Meanwhile the genuinely struggling
    # tutors on that board have no tickets at all.
    #
    # The events are still collected and reported, for the per-tutor attendance
    # rate and the repeat-pattern trigger that opens an evaluation. They just no
    # longer assert fault. A missed lesson becomes a tutor issue when a FAMILY
    # reports it, which the inbound leg handles.
    #
    # Turning this back on re-asserts blame the data cannot support.
    sweep_auto_ticket: false
    # Events per tutor per week required to open a ticket. 1 = every missed
    # lesson is ticket-worthy (recurrence in the same week updates the one
    # ticket rather than spawning more).
    min_events_per_week: 1
    # Lateness leg — OFF until the live-data probe proves Teachworks records
    # an actual start distinct from the scheduled start, and Roman approves
    # a threshold from the observed distribution (PR: do not pick silently).
    lateness:
      enabled: false
      threshold_minutes: null
  notes_not_completed:
    # "Unmarked" is the complement of the marked statuses — same rule as
    # ops/scorecard/aplus_weekly_sync.py is_unmarked() (the <3% scorecard
    # metric source). Do not build a second definition.
    marked_statuses: ["attended", "completed", "cancelled", "canceled",
                      "no_show", "missed", "no show"]
    min_events_per_week: 1

inbound:
  # Email leg: consumes email/state/audit_log.jsonl (the LIVE triage agent's
  # committed audit trail) — this engine never touches the triage code or
  # its inbox. Bodies come from the HubSpot Conversations thread.
  email:
    audit_log: "email/state/audit_log.jsonl"
    # Categories worth a reasoning pass. tutor_issue is the direct hit;
    # scheduling/complaint catch "tutor didn't show" reports that triage
    # filed under the family-facing category.
    scan_categories: ["tutor_issue", "scheduling", "complaint"]
  # SMS leg: inbound texts on the monitored JustCall lines (same account
  # the call agent polls).
  sms:
    enabled: true
    lookback_minutes: 180    # overlap window; idempotency comes from state, not the window
  # Reasoning gate: below this confidence the engine does NOT create a
  # ticket — it flags the report to the scheduler to file manually
  # ("otherwise they do it on their own").
  min_confidence: 0.75
  max_scan_per_run: 30       # cost/blast ceiling on LLM extraction calls

intake:
  # Structured manual intake for types 2/4/5 in #tutor-issues:
  #   tutor-issue <type> | <tutor email or tw:<acct>:<employee_id> or "First Last"> | <one-line evidence>
  # Free text that cannot resolve to exactly one tutor contact is rejected
  # with a threaded reply saying why. Allowed types here are the three
  # manual ones — 1 and 3 are auto-detected and refused at intake to keep
  # one source of truth per type.
  allowed_types: ["tutor_change_requested", "scheduling_flip_flop", "tech_issue_unreported"]

# "The tutor is late" texts (Roman 2026-09-10). A family text that reasons to
# missed_lesson_or_late opens the ticket with BOTH contacts on it (tutor and
# the family who texted) and hands it to that student's scheduler, so nobody
# has to tell a scheduler by hand. The block is the switch: delete it (or set
# enabled: false) and the engine goes back to tutor-only, Operations-owned.
late_reports:
  enabled: true
  route_to_scheduler: true   # missed_lesson_or_late tickets go to the student's scheduler, not operations
  associate_family: true     # add the texting family contact to the ticket alongside the tutor
  # The A-L / M-Z split keys on the STUDENT'S SURNAME, read from
  # student_last_name_if_diff_from_parent and falling back to the family
  # contact's lastname. NOT student_last_name: that property is labelled
  # "Student FIRST Name" in ops/hubspot-schema/properties.yml, so routing on
  # it would split the schedulers by first initial.

# Slack did not reach the tutor, so we texted them (Roman 2026-09-14: "the
# tutors that don't respond in Slack need a ticket created, we resorted to
# text messages but we need to know about that so we can sort them out").
#
# Detection is deliberately literal. We only count an outbound text that
# ITSELF mentions Slack, because that text is us saying, in our own words,
# that Slack did not work. Inferring "this looks like a chase" would put a
# quality ticket on a tutor's record from a hunch.
#
# The fuller detector (asked in the tutor's channel, no reply in N hours)
# needs the bot invited to the private #first-last channels; it is not, so
# conversations.history cannot see them. Invite the bot and that leg becomes
# buildable. Until then this catches the fallback itself, which is the part
# Roman asked to know about.
slack_fallback:
  enabled: true
  lookback_minutes: 1440     # overlap window; idempotency comes from state, not the window
  markers: ["slack"]         # substring, case-insensitive, matched on the body we sent
  # A tutor in a lesson is not a tutor ignoring us. Hannah Thorn, 2026-09-15:
  # "you messaged me on slack at 12:12 and texted at 12:21, but I was in the
  # session." Nine minutes is not going quiet, and a ticket there blames a
  # tutor for teaching. The engine cannot read the private tutor channels, so
  # it cannot measure the real gap between the Slack ask and the text; it can
  # only require that the CHASE ITSELF names an urgent deadline, or that the
  # same tutor was chased more than once. A single unhurried text is not
  # evidence of silence and is skipped.
  require_urgency_or_repeat: true
  # Phrases that show the sender had already waited and needed an answer.
  urgency_markers:
    - "following up"
    - "follow up"
    - "gently"
    - "i need to know"
    - "need to know today"
    - "by today"
    - "still waiting"
    - "haven't heard"
    - "have not heard"
    - "second time"
  # Bulk/auto templates that can mention Slack without being a chase.
  ignore_bodies_starting:
    - "hi, this is a+ tutoring. we saw your call"
    - "hi, this is a+ tutoring. we were assisting"
    - "hey"                  # applicant confirmations open "Hey <name>, ... application"
  # Tutors who have no Slack by policy (Roman 2026-09-08): texting them is the
  # normal channel, not a failure. Numbers, because the SMS-only tutors are
  # exactly the ones with thin contact records (Christa has two).
  sms_only_tutors: ["+18183395667"]
  # Only ticket tutors who are actually on the roster. "Not found" and
  # "Inactive" are applicants and leavers; chasing them is not a quality
  # signal. Prefix match against the tutor_roster_status LABEL.
  roster_status_prefixes: ["active"]

# Priority defaulted by type (stated in the PR; hs_ticket_priority values).
priority_by_type:
  missed_lesson_or_late: HIGH        # family was stood up — retention risk now
  tutor_change_requested: HIGH       # a fast switch saves the account
  tech_issue_unreported: MEDIUM      # process breach, not yet a family-facing failure
  scheduling_flip_flop: MEDIUM       # churn pattern — needs a conversation, not a fire drill
  notes_not_completed: LOW           # compliance lag; the scorecard already tracks the aggregate
  unresponsive_in_slack: MEDIUM      # a student went unplaced while we chased; pattern matters more than one instance

# Dedupe periods — ONE open ticket per tutor per issue type per period;
# recurrence updates the existing ticket. Weekly for the Teachworks
# detectors (matches the data cadence), rolling 30 days for report-driven
# types. Roman 2026-08-26: undecided — tune here, flagged in the PR.
dedupe_period:
  missed_lesson_or_late: weekly
  notes_not_completed: weekly
  tutor_change_requested: rolling_30d
  scheduling_flip_flop: rolling_30d
  tech_issue_unreported: rolling_30d
  # Rolling 30 days: three chases in a month is the signal, and it should land
  # on ONE ticket that shows all three rather than three separate ones.
  unresponsive_in_slack: rolling_30d

# NOTIFICATION GUARDS (non-negotiable — the aging-sweep near-miss of
# 2026-08-25 fired 80 DMs in a dry run; this engine must refuse to act
# rather than flood).
guards:
  max_tickets_per_run: 10
  max_notifications_per_run: 10
  # First run with no state/baseline.json stamps everything already
  # qualifying and creates/sends NOTHING. Not configurable off.

claude:
  model: "claude-opus-4-7"   # repo-standard (matches ops/call_agent, ops/feedback-agent)
  max_tokens: 1200
