# ops/lead_intake — stage 01 (first touch) engine config.
#
# Ceiling comes from knowledge/journey/01-first-touch.md, not from this file:
#   alone : classify, create the alert task with the routing owner + SLA,
#           stamp an [Agent] note
#   draft : the reply, for the owning seat to send
#   ask   : nothing outbound on a channel the contact did not use
# `send: false` below is that ceiling in code. Flipping it needs stages 00 and
# 01 REVIEWED + agent_readable, and Roman's go.

send: false                  # LOCKED off until knowledge/journey 00 + 01 are REVIEWED

# How far back a first run may look when no cursor exists yet. The first run
# baseline-stamps instead of acting (fleet guard), so this only bounds the
# stamp.
baseline_lookback_hours: 24

# Conversion events that mean "a person asked us for tutoring". Matched
# case-insensitively as substrings of recent_conversion_event_name, so a new
# landing page carrying the same form is covered the day it ships. This is the
# replacement for the 29 pinned form GUIDs in HubSpot flow 50818589.
intake_events:
  - "main intake form"
  - "get started now full length"
  - "request a free consultation"

# Events that are NOT a tutoring lead, checked first.
not_a_lead:
  - "become a tutor"
  - "tutor compliance"
  - "tutor referral program"
  - "teacher scholarship"
  - "student-diagnostic-test-upload"

# audience -> seat, line, SLA. Seats are role keys (email/config.yaml roles:).
# Lines are presend.lines keys. Mirrors the identity map in
# knowledge/journey/README.md and the 2026-08-25 sender routing rule.
routing:
  family:        { seat: charter_sales, line: charter_sales, sla_hours: 1.5, purpose: lead_first_touch }
  tor:           { seat: charter_sales, line: charter_sales, sla_hours: 8,   purpose: lead_first_touch }
  decision_maker: { seat: sales,         line: charter_sales, sla_hours: 8,   purpose: lead_first_touch }
  tutor:         { seat: scheduling_lead, line: support,     sla_hours: 8,   purpose: lead_first_touch }

# Spam fingerprints seen in the Aug/Sep intake (3 of 42 leads). A spam hit
# creates no task and no note; it is counted in the run report only.
spam:
  # a phone whose country code is not +1 after normalisation
  non_us_phone: true
  # the same phone across more than this many contacts in the window
  shared_phone_max: 2
  email_domains: []

# The seat's working window, Pacific. An SLA clock that expires at 02:33 is
# noise that teaches the seat to ignore due dates, so a due time outside the
# window is pushed to the next window open. The replay of 2026-08-15..09-14
# produced four of these (Deepak Amarnani 01:03 -> due 02:33, Sarah Adams
# 02:32 -> 04:02, Vaani Arora 23:57 -> 01:27, Namit Joshi 18:21 -> 19:51).
work_window:
  open_hour: 8
  close_hour: 18

# ── The chase ladder (Roman, 2026-09-15) ──────────────────────────
# "Thanks for reaching out, I just sent you a link with my calendar, let me
# know when we can connect" + the same by email. Then if they book, stop. If
# 12 hours later they have not booked, nudge. Then keep working to get them to
# the meeting, and a held meeting makes them a QTL.
#
# Measured on the 40 real leads of 2026-08-15..09-14: 4 booked (10%). Time to
# book was 1, 1, 2 and 13 days. So step 2 at 12h is right (it lands before the
# 1-day bookings would have happened anyway for most), and the ladder must run
# past day 1 or it misses people like Roni Beck who booked on day 13.
#
# Every step re-runs presend.check() at fire time. A step is skipped, not
# queued, if the family has exited.
cadence:
  - key: ack_sms
    after_minutes: 0
    channel: sms
    template: ack-sms.txt
    purpose: lead_first_touch
  - key: ack_email
    after_minutes: 0
    channel: email
    template: ack-email.txt
    purpose: lead_first_touch
  - key: nudge_1
    after_minutes: 720          # 12 hours
    channel: sms
    template: nudge-1-sms.txt
    purpose: lead_first_touch
  - key: nudge_2
    after_minutes: 2880         # day 2
    channel: email
    template: nudge-2-email.txt
    purpose: lead_first_touch
  - key: handoff
    after_minutes: 5760         # day 4: stop automating, hand the seat a task
    channel: task
    purpose: lead_first_touch

# Anything here means STOP the ladder. Checked before every step.
#
# `meeting_booked` deliberately reads real MEETING objects, not the lead
# status. HubSpot flow 1868302723 sets Meeting Booked only when the meeting
# TITLE contains "Tutoring Call w/", and 1 of the 4 real bookings in the
# window was titled "A+ Tutoring Initial Call, Annalee w Paola" and so was
# never detected. Nudging a family who already booked is the worst thing this
# ladder can do, so the exit check does not depend on a title match.
exit_signals:
  meeting_booked: true          # any MEETING created after the conversion
  replied: true                 # presend.has_replied_since: inbox or any line
  call_logged: true             # a real CALL engagement exists
  deal_created: true            # a deal created after the conversion
  lead_status_any_of:
    - "Meeting Booked"
    - "We Connected"            # QTL - NEW
    - "CAP"
    - "QTL - Diagnostic Sent"
    - "QTL - Charter"
    - "OPEN_DEAL"
    - "UNQUALIFIED"
    - "Using Someone Else"

# Cap per run. A number above this aborts BEFORE any write (fleet guard).
max_leads_per_run: 25
