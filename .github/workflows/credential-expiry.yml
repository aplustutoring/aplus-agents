name: Credential expiry check

# Warns when a credential in knowledge/credentials.yml is within 180 days of
# expiring (#AP044). READ-ONLY: it never edits copy or flips public_ready.
# Monthly is the right cadence for a 180-day window — the warning repeats for
# six months before anything lapses, which is plenty of notice without noise.
on:
  schedule:
    - cron: "0 16 1 * *"     # 1st of each month, 09:00 PT / 08:00 PST
  workflow_dispatch:
    inputs:
      window_days:
        description: "Warn when expiry is within this many days"
        default: "180"
      today:
        description: "Override today (YYYY-MM-DD) to test the warning"
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml requests
      - name: Check credential expiry
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CREDENTIAL_ALERT_CHANNEL: ${{ secrets.CREDENTIAL_ALERT_CHANNEL }}
        run: |
          python3 scripts/credential_expiry_check.py --slack \
            --window-days "${{ inputs.window_days || '180' }}" \
            ${{ inputs.today && format('--today {0}', inputs.today) || '' }}
