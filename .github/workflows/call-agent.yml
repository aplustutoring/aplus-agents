name: Call agent — webhook-triggered polls + daily digest (~5:30 PM PT)

# Fleet convention: agents think in Pacific Time. Naive datetime.now()/
# date.today() in the scripts resolve to PT, keeping human-facing labels and
# date-window logic in sync. Crons remain UTC (see schedule comments).
env:
  TZ: America/Los_Angeles

# Trigger model (2026-08-28 — replaced the every-15-min poll crons):
#   - EVENT runs: JustCall fires a webhook when a call completes ->
#     ops/call_agent/webhook-relay (Cloudflare Worker) waits a few minutes for
#     the AI transcript, then hits workflow_dispatch with no_digest=true.
#     Coaching cards + alerts post per call, minutes after hangup; digest
#     entries are held in state. GitHub was honoring only ~4 of the ~50 daily
#     poll crons (hours-long gaps), which is WHY the crons had to go.
#   - DIGEST run (30 0 = ~5:30 PM PT): processes + flushes all held entries
#     as the daily digest. Also the backstop sweep: anything a webhook ever
#     drops is at most one day late. Human manual dispatches also post the
#     digest (no_digest defaults false).
#
# SAFETY DEFAULT: runs in --dry-run until the repo *variable* CALL_AGENT_LIVE
# is set to "true" (Settings -> Secrets and variables -> Actions -> Variables).
# Dry-run does real JustCall + Claude reads but prints instead of writing to
# HubSpot/Slack and does not persist state.
on:
  schedule:
    - cron: "30 0 * * *"        # DIGEST: 00:30 UTC = 17:30 PDT / 16:30 PST daily
    - cron: "0 16 * * 1"        # WEEKLY SCORECARD: Mon 9 AM PDT / 8 AM PST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Force dry run (fetch + summarize, no HubSpot/Slack writes)"
        type: boolean
        default: true
      check_only:
        description: "Smoke test: confirm secrets wired, skip all reads/writes"
        type: boolean
        default: false
      since:
        description: "Optional manual cursor override (UTC ISO, e.g. 2026-07-09T00:00:00)"
        type: string
        default: ""
      no_digest:
        description: "Hold digest entries for the daily flush (webhook-relay poll runs pass true)"
        type: boolean
        default: false

permissions:
  contents: write   # state file commit-back (topic-gen pattern)

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: call-agent-state-write
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ops/call_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run call agent
        env:
          JUSTCALL_API_KEY: ${{ secrets.JUSTCALL_API_KEY }}
          JUSTCALL_API_SECRET: ${{ secrets.JUSTCALL_API_SECRET }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CHECK_ONLY: ${{ inputs.check_only && 'true' || '' }}
        run: |
          ARGS=""
          # Live only when explicitly opted in via repo variable AND the manual
          # dispatch didn't force dry-run. Scheduled runs use the variable alone.
          if [ "${{ vars.CALL_AGENT_LIVE }}" != "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ inputs.since }}"
          fi
          # Webhook-relay poll runs (no_digest=true) hold digest entries; the
          # 00:30 UTC cron and human manual dispatches post the daily digest.
          if [ "${{ inputs.no_digest }}" = "true" ]; then
            ARGS="$ARGS --no-digest"
          fi
          # Monday 16:00 UTC cron posts the weekly per-person scorecard instead
          # of polling (the */15 poll cron fires separately and still polls).
          if [ "${{ github.event.schedule }}" = "0 16 * * 1" ]; then
            ARGS="--weekly-scorecard"
          fi
          python3 call_agent.py $ARGS
      # "Transcript not ready — retrying next run" needs a next run to exist
      # now that the poll crons are gone. The agent drops state/retry_wanted
      # when calls are inside the transcript grace window; this asks the relay
      # to dispatch again in 10 minutes. Best-effort: if the relay is down or
      # the secrets aren't set, the daily digest run sweeps the call up.
      - name: Schedule retry for pending transcripts
        env:
          RELAY_URL: ${{ secrets.CALL_RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.CALL_RELAY_TOKEN }}
        run: |
          if [ -f state/retry_wanted ]; then
            if [ -n "$RELAY_URL" ] && [ -n "$RELAY_TOKEN" ]; then
              curl -fsS -m 15 -X POST "$RELAY_URL/redispatch?token=$RELAY_TOKEN&delay=10" \
                || echo "redispatch request failed — daily digest run is the backstop"
            else
              echo "retry wanted but CALL_RELAY_URL/CALL_RELAY_TOKEN unset — daily digest run is the backstop"
            fi
          fi
      - name: Commit state changes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Dry-run/check-only runs write no state; --ignore-errors tolerates the
          # file not existing yet.
          git add --ignore-errors ops/call_agent/state/state.json ops/call_agent/state/scores.jsonl || true
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "call-agent: persist state for $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "state push attempt $attempt rejected; retrying..."
              sleep $((attempt * 3))
            done
          fi
