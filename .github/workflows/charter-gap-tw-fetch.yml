name: Charter gap — Teachworks fetch (manual)

# Fetch stage only: TEACHWORKS_API_KEY lives in Actions secrets (local plaintext
# copies were purged 2026-06-29), so the read-only Teachworks pull runs here and
# the invoices/customers JSON comes back as an artifact for the local analysis
# run of scripts/charter_gap_analysis.py.
env:
  TZ: America/Los_Angeles

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: "Invoice window start (YYYY-MM-DD)"
        type: string
        default: "2025-08-01"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch Teachworks invoices + customers
        env:
          TEACHWORKS_API_KEY: ${{ secrets.TEACHWORKS_API_KEY }}
        run: python3 scripts/charter_gap_analysis.py --fetch-teachworks tw_data.json --start "${{ inputs.window_start }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tw-data
          path: tw_data.json
          retention-days: 3
