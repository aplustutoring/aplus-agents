name: Email — triage (inbox poll)

# Fleet convention: agents think in Pacific Time. Naive datetime.now()/
# date.today() in the scripts resolve to PT, keeping human-facing labels and
# date-window logic in sync. Crons remain UTC (see schedule comments).
env:
  TZ: America/Los_Angeles

# LIVE since the 2026-07-22 cutover (this monorepo is the production email agent).
# Re-enable at flip by uncommenting the schedule block below (verbatim from the old repo).
# Cadence (UTC; PT business hours = 9-18 America/Los_Angeles, Mon-Fri):
#   PDT (Mar-Nov): 9-18 PT = 16:00-01:00 UTC.  PST (Nov-Mar): 9-18 PT = 17:00-02:00 UTC.
# Runs are idempotent (audit-log message-id dedupe) so overlapping fires are safe.
on:
  schedule:
    - cron: "*/5 16-23 * * 1-5"   # business window (UTC), weekdays
    - cron: "*/5 0-2 * * 1-5"     # business window wrap past midnight UTC, weekdays
    - cron: "0 * * * *"            # hourly everywhere else (off-window + weekends)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log intended actions, write nothing)"
        required: false
        type: boolean
        default: false
      replay_thread:
        description: "Low-balance agent: replay ONE Teachworks alert by HubSpot thread id instead of polling (pair with dry_run)"
        required: false
        default: ""
      simulate_days:
        description: "With replay_thread: then run the sweep as if the case opened N days ago (1 = text + teacher, 7 = risk, 28 = lost)"
        required: false
        default: ""
      backfill_days:
        description: "Low-balance agent: open cases for every Teachworks alert of the last N days that has none (pair with dry_run to preview)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    concurrency:
      # A dry-run replay/backfill writes no state, so it must not queue behind
      # (or be cancelled by) the 5-minute poll: GitHub keeps ONE pending run per
      # group and cancels the older one, which killed run 34538803410.
      group: aplus-email-state${{ (inputs.replay_thread != '' || inputs.backfill_days != '') && inputs.dry_run && '-dryrun' || '' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run triage
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          TEACHWORKS_TOKEN: ${{ secrets.TEACHWORKS_TOKEN }}
          TEACHWORKS_TOKEN_INPERSON: ${{ secrets.TEACHWORKS_TOKEN_INPERSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          # Same service account as the retention sync — the standalone email repo's
          # local JSON was wiped in the 6/29 secrets cleanup; the value lives on here.
          GOOGLE_SHEETS_CREDS: ${{ secrets.RETENTION_SA_JSON }}
          # the low-balance agent sends the day-0 family email (Resend) and,
          # on replay/backfill, reads JustCall for family replies
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JUSTCALL_API_KEY: ${{ secrets.JUSTCALL_API_KEY }}
          JUSTCALL_API_SECRET: ${{ secrets.JUSTCALL_API_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOW_BALANCE_REPLAY_THREAD: ${{ inputs.replay_thread }}
          LOW_BALANCE_SIMULATE_DAYS: ${{ inputs.simulate_days }}
          LOW_BALANCE_BACKFILL_DAYS: ${{ inputs.backfill_days }}
          LOW_BALANCE_FORCE_ARMED: ${{ (inputs.replay_thread != '' || inputs.backfill_days != '') && inputs.dry_run && '1' || '0' }}
        run: python -m src.main

      - name: Commit state changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/cursor.json state/audit_log.jsonl
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "email-triage: persist state for $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break
              echo "state push attempt $attempt rejected; retrying..."
              sleep $((attempt * 3))
            done
            # Silent fall-through here LOST a run's audit records on 2026-08-31
            # (the Lia Beck recovery) and the run still reported success.
            # Now: verify, scream, and fail the job so the retry sweeper takes over.
            if ! git push origin HEAD 2>/dev/null; then
              echo "::error::state persist FAILED after 3 attempts — this run's audit records are being lost"
              curl -s -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
                -H 'Content-type: application/json' \
                -d "{\"channel\":\"C0BL05MCJ4B\",\"text\":\"🧨 ${GITHUB_WORKFLOW}: state persist FAILED after 3 attempts. This run's audit records are lost unless it reruns. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
              exit 1
            fi
          fi
