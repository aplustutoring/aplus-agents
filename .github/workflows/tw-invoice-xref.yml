name: TW invoice cross-reference (read-only)

# Manual report: recent PO deals ↔ Teachworks invoices. Writes nothing —
# results are in the run log. See email/invoice_xref.py.
on:
  workflow_dispatch:
    inputs:
      student_first:
        description: "Optional: look up ONE student by name instead (first)"
        required: false
        type: string
        default: ""
      student_last:
        description: "…(last)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cross-reference
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          TEACHWORKS_TOKEN: ${{ secrets.TEACHWORKS_TOKEN }}
          TEACHWORKS_TOKEN_INPERSON: ${{ secrets.TEACHWORKS_TOKEN_INPERSON }}
          STUDENT_FIRST: ${{ inputs.student_first }}
          STUDENT_LAST: ${{ inputs.student_last }}
        run: |
          if [ -n "$STUDENT_FIRST" ]; then python -m tw_student_lookup; else python -m invoice_xref; fi
