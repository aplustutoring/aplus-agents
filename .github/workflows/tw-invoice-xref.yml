name: TW invoice cross-reference (read-only)

# Manual report: recent PO deals ↔ Teachworks invoices. Writes nothing —
# results are in the run log. See email/invoice_xref.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cross-reference
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          TEACHWORKS_TOKEN: ${{ secrets.TEACHWORKS_TOKEN }}
          TEACHWORKS_TOKEN_INPERSON: ${{ secrets.TEACHWORKS_TOKEN_INPERSON }}
        run: python -m invoice_xref
