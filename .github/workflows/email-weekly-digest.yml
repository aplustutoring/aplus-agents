name: Email — weekly digest

# Fleet convention: agents think in Pacific Time. Naive datetime.now()/
# date.today() in the scripts resolve to PT, keeping human-facing labels and
# date-window logic in sync. Crons remain UTC (see schedule comments).
env:
  TZ: America/Los_Angeles

# LIVE since the 2026-07-22 cutover (this monorepo is the production email agent).
# Monday 8:00 AM PT. PDT = 15:00 UTC, PST = 16:00 UTC. Both fire; the digest is
# idempotent for the same week so the duplicate is harmless.
on:
  schedule:
    - cron: "0 15 * * 1"   # 08:00 PDT Monday
    - cron: "0 16 * * 1"   # 08:00 PST Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print digest, write nothing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          # Same service account as the retention sync — the standalone email repo's
          # local JSON was wiped in the 6/29 secrets cleanup; the value lives on here.
          GOOGLE_SHEETS_CREDS: ${{ secrets.RETENTION_SA_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m src.digest
