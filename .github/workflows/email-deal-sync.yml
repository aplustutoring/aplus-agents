name: Email — deal sync (HubSpot → Teachworks)

# Fleet convention: agents think in Pacific Time. Naive datetime.now()/
# date.today() in the scripts resolve to PT, keeping human-facing labels and
# date-window logic in sync. Crons remain UTC (see schedule comments).
env:
  TZ: America/Los_Angeles

# LIVE since the 2026-07-22 cutover (this monorepo is the production email agent).
on:
  schedule:
    - cron: "*/15 16-23 * * 1-5"
    - cron: "*/15 0-2 * * 1-5"
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log intended creates/updates, write nothing)"
        required: false
        type: boolean
        default: false
      deal_id:
        description: "FORCE: really sync this one HubSpot deal id (bypasses pilot mode; guards still apply)"
        required: false
        type: string
        default: ""
      contact_email:
        description: "With deal_id: HubSpot contact email to associate to the deal + sync as the family"
        required: false
        type: string
        default: ""
      student_first:
        description: "With deal_id: student first name to create (when not in the deal name)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: aplus-email-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run deal sync
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          TEACHWORKS_TOKEN: ${{ secrets.TEACHWORKS_TOKEN }}
          TEACHWORKS_TOKEN_INPERSON: ${{ secrets.TEACHWORKS_TOKEN_INPERSON }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JUSTCALL_API_KEY: ${{ secrets.JUSTCALL_API_KEY }}
          JUSTCALL_API_SECRET: ${{ secrets.JUSTCALL_API_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_DEAL_ID: ${{ inputs.deal_id }}
          FORCE_CONTACT_EMAIL: ${{ inputs.contact_email }}
          FORCE_STUDENT_FIRST: ${{ inputs.student_first }}
        run: python -m src.deal_sync
      - name: Commit state changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sync_cursor.json state/audit_log.jsonl
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "email-deal-sync: persist state for $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break
              echo "state push attempt $attempt rejected; retrying..."
              sleep $((attempt * 3))
            done
            # Silent fall-through here LOST a run's audit records on 2026-08-31
            # (the Lia Beck recovery) and the run still reported success.
            # Now: verify, scream, and fail the job so the retry sweeper takes over.
            if ! git push origin HEAD 2>/dev/null; then
              echo "::error::state persist FAILED after 3 attempts — this run's audit records are being lost"
              curl -s -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
                -H 'Content-type: application/json' \
                -d "{\"channel\":\"C0BL05MCJ4B\",\"text\":\"🧨 ${GITHUB_WORKFLOW}: state persist FAILED after 3 attempts. This run's audit records are lost unless it reruns. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
              exit 1
            fi
          fi
