name: Ticket reasoning sweep

# Reads every OPEN ticket, gathers evidence across HubSpot, the charter@ Gmail
# thread and JustCall, decides what state the ticket is really in, then closes
# or pesters on the 24/48/96h ladder.
#
# Closing is double-gated: `reasoner.allow_close` in email/config.yaml AND a
# per-ticket confidence >= reasoner.close_min_confidence. Run dry_run first --
# it prints every verdict with its evidence and writes nothing.
env:
  TZ: America/Los_Angeles

on:
  schedule:
    # Daily drumbeat, weekday mornings PT (Roman 2026-09-18: "I want Kath to be
    # pestered if she doesn't do shit"). Scheduled runs are DRY until the repo
    # variable REASONER_LIVE is "true": Roman reads one dry pass first, then
    # flips it. Manual dispatches keep their own inputs.
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print verdicts, write nothing)"
        required: false
        default: "true"
      limit:
        description: "Only look at the first N open tickets (blank = all)"
        required: false
        default: ""
      no_pester:
        description: "Close only, send no DMs (use for the first live pass)"
        required: false
        default: "false"

permissions:
  contents: write   # audit-log commit-back (pester dedupe reads it next day)

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: aplus-email-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: email
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # branch TIP at job start, never the dispatch-time SHA (2026-09-10 stale-checkout incident)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reasoning sweep
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN_VISIONARY: ${{ secrets.SLACK_USER_TOKEN_VISIONARY }}
          # Same service account as the PO inbox — needed to read the charter@
          # Gmail threads, which is where every PO reply actually lives.
          GOOGLE_SHEETS_CREDS: ${{ secrets.RETENTION_SA_JSON }}
          JUSTCALL_API_KEY: ${{ secrets.JUSTCALL_API_KEY }}
          JUSTCALL_API_SECRET: ${{ secrets.JUSTCALL_API_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          NO_PESTER: ${{ inputs.no_pester }}
          REASONER_LIVE: ${{ vars.REASONER_LIVE }}
        run: |
          ARGS=""
          # Scheduled run (no inputs): live only once REASONER_LIVE=true.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$REASONER_LIVE" != "true" ]; then DRY_RUN=true; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$NO_PESTER" = "true" ]; then ARGS="$ARGS --no-pester"; fi
          python -m src.ticket_reasoner $ARGS
      - name: Commit audit log
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email/state/audit_log.jsonl
          if git diff --cached --quiet; then
            echo "no audit changes to commit"
          else
            git commit -m "ticket-reasoner: persist audit for $(date -u +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "state push attempt $attempt rejected; retrying..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
          fi
