name: Feedback agent — weekly digest (Friday ~4 PM PT)

# Fleet convention: agents think in Pacific Time (see registry.yml header).
env:
  TZ: America/Los_Angeles

# Friday PM: one post in #agent-feedback — counts by agent and type,
# unresolved corrections aging, demotion-review candidates (>=3
# WRONG/ANNOYING in 14 days) for Emily's ledger. The same digest is written
# to ops/feedback-agent/state/digest-latest.md as input to the Integrator's
# Monday brief. Aggregates by agent, never by person.
#
# Fixed-UTC cron pinned to PDT (scorecard convention — winter runs ~1h
# earlier in PT, harmless, avoids dual-cron double-runs).
on:
  schedule:
    - cron: "0 23 * * 5"   # 16:00 PDT / 15:00 PST Friday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest instead of posting"
        type: boolean
        default: true

permissions:
  contents: write   # digest-latest.md commit-back

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: feedback-agent-state-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # fresh state.json even when queued behind another feedback run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r ops/feedback-agent/requirements.txt
      - name: Run digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ vars.FEEDBACK_AGENT_LIVE }}" != "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 ops/feedback-agent/feedback_agent.py --mode digest $ARGS
      - name: Commit digest + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors ops/feedback-agent/state/ || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feedback-agent: weekly digest for $(date +%Y-%m-%d)"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt rejected; retrying..."
              sleep $((attempt * 3))
            done
          fi
