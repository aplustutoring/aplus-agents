# knowledge/credentials.yml — the fleet's credential facts, single source of truth.
#
# WHY THIS FILE EXISTS (#AP044, 2026-08-25): a credential claim that is copied
# into agent prompts, templates and copy files is guaranteed to go stale. The
# HubSpot property consolidation doctrine applies to claims as much as to
# properties: declare once, read everywhere, never duplicate.
#
# RULES
#   * Agents READ this file. They never write it, and never inline a claim
#     string of their own.
#   * `claim_string` is canonical. Do not paraphrase it, do not drop the term
#     window. A claim without its date range is a DEFECT.
#   * `public_ready: false` is a HARD GATE enforced in code, not convention.
#     A credential with public_ready false must not reach any external surface.
#   * Anything unknown stays null with a TODO. Never guess a credential fact.
#
# This file lives in knowledge/ because knowledge/ is already defined as the
# "versioned consultation handbook ... material that agents read but do not
# generate" (knowledge/README.md). The #AP044 handoff proposed shared/, but no
# shared/ data directory exists at the repo root; marketing/scripts/shared/ is
# script code, not reference data. Extending knowledge/ avoids a parallel home
# for the same kind of fact.

credentials:
  nssa_program_design_badge:
    name: "NSSA Tutoring Program Design Badge"
    issuer: "National Student Support Accelerator"
    issuer_short: "NSSA"
    term_start: 2026
    term_end: 2029

    # CANONICAL. Do not paraphrase. The term window travels with every use.
    claim_string: "NSSA Tutoring Program Design Badge, 2026-2029"

    # Roman 2026-08-25: "expires august 2029". Day-of-month not stated, so the
    # last day of the month is used — the 180-day warning fires around
    # 2029-03-04 either way, so day precision does not change behaviour.
    expires_on: "2029-08-31"
    expires_on_confirmed: true   # month confirmed by Roman; exact day assumed

    # Roman 2026-08-25: does not have the logo files yet; likely available on
    # the NSSA site. Stays null until the real files land somewhere durable.
    asset_path: null           # TODO — badge image files not yet in hand

    # Roman 2026-08-25: usage guidelines not yet in hand, likely published by
    # NSSA. public_ready CANNOT flip until these are read and confirmed —
    # finding a URL is not the same as confirming the terms.
    usage_guidelines_url: null # TODO — NSSA attribution/display rules unread

    # Approved surfaces. NOTE which of these have code behind them and which
    # are human work — the list is permission, not automation. Verified
    # 2026-08-25: aplus-agents is the ENTIRE surface (there is no second repo;
    # the #AP044 handoff referred to a ~/code/skills that does not exist).
    approved_surfaces:
      # produced by agents in this repo — resolve via scripts/credentials.py
      - case_studies            # marketing/skills/aplus-spotlight-case-study
      - blog_author_bio         # marketing/skills/aplus-blog-longform
      # produced by HUMANS, no generator exists anywhere. This file is their
      # reference: copy the claim_string verbatim, do not retype it.
      - charter_vendor_packets  # Danielle, by hand
      - intervention_proposals  # Danielle, by hand
      # live outside this repo entirely (HubSpot / website CMS). Nothing here
      # can enforce the gate on them, so they are a human checklist item when
      # public_ready flips.
      - website
      - email_signature

    # TEXT CLAIM: cleared for use. Roman 2026-08-25: "i just want it to be
    # known by our agents that we received the NSSA badge. its a big thing to
    # include in our marketing emails and marketing content."
    #
    # Stating a credential we hold is a statement of fact and is ours to make.
    # Roman is the claim authority. Agents may write the claim_string.
    public_ready: true

    # THE BADGE IMAGE IS A SEPARATE QUESTION and stays shut. Usage guidelines
    # govern display of NSSA's mark: size, clear space, placement, whether it
    # may sit beside our own logo. Those are unread, and a trademark is not
    # ours to render however we like. The text claim carries no such risk.
    logo_ready: false

    # Where the badge may NOT go, regardless of public_ready:
    prohibited_surfaces:
      - call_agent_scripts      # handoff-note context only, never scripted copy
      - sms                     # no room for the term window; a claim without it is a defect

    decision_log: "#AP044"
    decision_date: "2026-08-25"
    source_doc: "1rulyEYlUldSEPvlZtoM6KcKBa2tJ8ZlZ-HMDybbMYCI"
    claim_authority: roman      # roles-not-names: config maps role -> person
    partner_facing_owner: sales # Danielle's seat
