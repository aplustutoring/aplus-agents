  tutor_issue:         { owner: scheduling_lead,             sla_hours: 1.5, draft: false, priority: high }    # retention — a switch saves it
  complaint:           { owner: scheduling_lead,             sla_hours: 1.5, draft: false, priority: high }
  payment_dispute:     { owner: scheduling_lead,             sla_hours: 1.5, draft: false, priority: high }
  school_partner:      { owner: sales,          sla_hours: 1.5, draft: true,  priority: high }
  business_dev:        { owner: sales,          sla_hours: 8,   draft: true,  priority: normal }  # partnerships/collabs/pitches worth a look
  campaign_family:     { owner: charter_sales,  sla_hours: 1.5, draft: true,  priority: high }    # campaign replies: sign-ups/referrals (Roman 2026-08-27)
  campaign_school:     { owner: sales,          sla_hours: 8,   draft: true,  priority: normal }  # campaign replies from TORs/school staff
  tor_inquiry:         { owner: charter_sales,             sla_hours: 1.5, draft: true,  priority: normal }
  new_po:              { owner: charter_sales,             sla_hours: 1.5, draft: true,  priority: normal }
  tutor_document:      { owner: charter_admin,              sla_hours: 1.5, draft: true,  priority: low }
  recruitment:         { owner: scheduling_lead,             sla_hours: 1.5, draft: true,  priority: low }
  charter_newsletter:  { owner: sales,          sla_hours: 48,  draft: false, priority: low, fyi: true }  # FYI, no reply
  junk:                { owner: null,              sla_hours: null, draft: false, auto_archive: true }
  unknown:             { owner: scheduling_lead,             sla_hours: 4,   draft: false, review: true }  # Mandy owns the Stuck queue

# Last-name split boundary for scheduling/cancellation.
scheduler_split:
  a_to_l: scheduler_a_l   # last name initial A-L
  m_to_z: scheduler_m_z   # last name initial M-Z

# Cancellation re-engagement follow-up: on a cancellation, schedule a task with a sample
# re-engagement email, due the sooner of +`days` or `by_date` (summer pauses → re-contact
# before fall). assign_to: "owner" = the scheduler, or a staff key (e.g. paola for retention).
cancellation_followup:
  enabled: true
  days: 90
  # Don't start win-backs in summer — any +90 date landing in these months bumps to the
  # fall term start. (1/1-area dates fall out of the +90 naturally for fall cancellations.)
  blackout_months: [5, 6, 7]   # May, June, July → bump to fall start
  blackout_to: "09-01"         # → September 1
  # Holiday blackout: week before Christmas through New Year's → resume after.
  holiday_blackout: { start: "12-18", end: "01-01", resume: "01-02" }
  assign_to: owner
  reengage_workflow_id: ""   # set a HubSpot workflow id to AUTO-ENROLL the family contact
                             # into a re-engagement drip on cancellation. Empty = off.

# Deal automation on cancellations. Auto-moves the student's deal to its pipeline's
# "Stopped" stage ONLY when: type=stop (not a pause), confidence ≥ min, and exactly ONE
# active deal matches the student. Anything else → surface the deal(s) for a human. Every
# move is logged with the old stage (reversible) and announced on the ticket + Slack.
deal_automation:
  enabled: true
  # Both pause AND stop close the current deal: each engagement period is its own deal,
  # and a returning family gets a NEW (renewal) deal — the win-back task handles that.
  # one_time never touches deals.
  auto_move_types: [stop, pause]
  min_confidence: 0.9
  active_stage_patterns: ["pre-lesson", "post-lesson", "only booking", "in program",
                          "active subscription", "pre-session", "post-session"]
  stop_stage_patterns: ["stopped", "closed lost", "cancelled", "refunded", "withdrew"]

# ── HubSpot → Teachworks deal sync (Zapier replacement) ─────────
# Every NEW HubSpot deal: upsert the family in Teachworks (match by EMAIL — the
# identifier; HubSpot contact info wins on update) and create the student. Account by
# pipeline; charter students get billing_method=Package, private pay=Service List Cost.
deal_sync:
  enabled: true
  dry_run_first: false         # LIVE since 2026-08-03 (pilot ran 2026-07-22 → 2026-08-03)
  in_person_pipelines: ["3067397", "16858643", "30837103"]   # → in-person TW account
  # Known charter pipelines → Package billing. ALSO automatic: any pipeline whose
  # NAME contains "Charter" is treated as charter — all charter families get
  # Package billing in Teachworks by default, listed here or not.
  charter_pipelines: ["907748", "72281989", "88841552", "5119061"]
  exclude_pipelines: ["971802", "145539386", "16195908"]  # New Tutor, School Partnership, Upsells
  charter_student_billing: "Package"
  private_student_billing: "Service List Cost"
  # Per-pipeline Teachworks overrides — each ONLINE pipeline can need different TW
  # settings after the family-exists check. Keys = HubSpot pipeline ids. Per entry:
  #   account: online | in_person       (overrides the account routing above)
  #   student_billing: "<TW billing method>"  (overrides the charter/private default)
  #   customer_fields: { <tw field>: value }  merged into the family CREATE and UPDATE
  #   student_fields:  { <tw field>: value }  merged into each student CREATE
  # An empty entry = today's behavior. TODO(Roman): fill in the real per-pipeline
  # settings before flipping dry_run_first off.
  pipeline_settings:
    "907748": {}     # Charter Trad (Traditional Vendor Funds) — Package via charter_pipelines
    "72281989": {}   # Charter Terri
    "88841552": {}   # Charter Amy
    "5119061": {}    # IEM Inc
    "21277473": {}   # Subscription
    # Gold Tutoring (pipeline "default") + Free Trial ("19120821"): add entries if needed
  # Smart invoice prompt: daily (hour_pt, PT) check of every ACTIVE charter PO deal —
  # student's attended TW hours >= PO hours → DM Kath to submit the invoice NOW;
  # otherwise DM once the invoice due date passes (deal due property, else the
  # deal-name '(Aug) 26/27' tag). One prompt per deal (audit invoice-prompt:{id}).
  invoice_sweep:
    enabled: true
    hour_pt: 9
    owner: charter_admin

# Returning-family deal creation: when a `scheduling` email is a returning customer
# booking new service (existing-customer signals + high confidence), create a NEW deal
# marked dealtype=existingbusiness (per the deal model: resumed families get a NEW deal,
# never a 'Renewal' deal; renewals only continue a just-ended deal).
b2c_deal:
  enabled: true
  min_confidence: 0.9
  dealtype: "existingbusiness"
  # Pipeline = follow the family's most recent B2C deal (their established service
  # type); fall back to Gold Tutoring. value = that pipeline's Pre-Lesson stage id.
  pipeline_stage_map:
    default: "appointmentscheduled"   # Gold Tutoring → Pre-Lesson
    "3067397": "3067398"              # In-Person → Pre-Lesson
    "21277473": "51098471"            # Subscription → Pre-Lesson
  fallback_pipeline: "default"

# ── Charter PO inbox (separate Gmail) ───────────────────────────
# LIVE since the 2026-07-22 cutover. Full admin-inbox treatment (ticket/draft/DM,
# owner Kath) + deal creation/dedupe + labels. Drafts are REAL Gmail drafts; the
# agent never sends from this address. Procedure: TEAM_PLAYBOOK.md §Charter PO inbox.
po_inbox:
  address: "charter@wetutorathome.com"
  owner: charter_admin
  # When a PO has no schedule and Teachworks has none either, this phrase is
  # stamped into the deal's schedule_preferences so the confirmation SMS asks
  # the family instead of ending blank. It renders after "...confirm that this
  # schedule still works for you:" in workflow 1603217415 — word it to follow
  # that colon.
  schedule_ask_fallback: >-
    we don't have your schedule on file yet! Please reply with the days and
    times that work best for your student
  deal_pipeline_id: "907748"   # Charter Schools - Traditional Vendor Funds
  waiting_for_po_stage: ""     # stage retired 2026-06-11 (deals moved to Stopped) — POs now CREATE deals
  advance_to_stage: "907749"   # Pre-Lesson (where new PO deals are created)
  label_processed: "A+ Agent/Processed"
  label_review: "A+ Agent/Needs Review"
  # LEVEL UP POs route to "Amy - Charter - iLead - Level Up" (Level Up A).
  # Verified against the portal 2026-07-31.
  levelup_pipeline_id: "88841552"
  levelup_stage_id: "164922249"    # its Pre-Lesson stage
  # Deal naming (Roman, 2026-08-10): "Parent - Student - School N - YY/YY".
  # N = the student's deal count at that school this school year + 1; the school
  # year comes from the PO's service month (Aug-Dec = first year, Jan-Jul = second).
  # Keys are matched case-insensitively as SUBSTRINGS of the extracted school name;
  # an unmapped school uses the extracted name and the ticket flags the gap.
  school_short_names:
    taylion: "Taylion"
    ilead: "iLead"
    gorman: "Gorman"
    heartwood: "Heartwood"
    sage oak: "Sage Oak"
    elite: "Elite"
    visions: "Visions"
    blue ridge: "Blue Ridge"
    heartland: "Heartland"
    suncoast: "Suncoast"
    ocean grove: "Ocean Grove"
    granite mountain: "Granite Mountain"
    horizon: "Horizon"
    epic: "Epic"
    julian: "JCS"
    jcs: "JCS"
    harvest ridge: "Harvest Ridge"
  # PO arrives with NO parent contact info and no unique HubSpot match → the deal
  # is named "NEEDS PARENT - ..." and the agent DRAFTS a parent-info request to the
  # TOR (else the sender) on the same thread — a human sends it (the agent never
  # sends from this address). The TOR's reply auto-creates the Family contact
  # (email + phone + persona), associates it to the deal, renames the deal, and
  # triggers the Teachworks sync. No reply within the window → escalation DM.
  parent_chase:
    enabled: true
    escalate_business_hours: 16        # 2 business days AFTER the draft is SENT
    draft_unsent_nag_business_hours: 4 # draft still in Gmail Drafts → 🚩 nag
    notify_charter_sales_after_hours: 24  # info still missing 24h after the email → charter sales
  # Pending order-agreement POs with no approval signal (duplicate alert =
  # approved PO re-arrived) get ONE nag to missing_info_dms after this window.
  # CALENDAR days: iLEAD/OPS portal approval takes at least 14 days from the
  # original email (Roman, 2026-08-26) — nagging earlier is pure false alarm.
  pending_portal_approval_days: 14
  # Gmail poll re-reads this many seconds BEFORE the cursor (the Lia Beck miss,
  # 2026-08-28: a message landing behind the cursor was invisible forever).
  # Re-listed mail is deduped by the audit log, so a wide window is free.
  cursor_overlap_seconds: 3600
  # Non-PO dispositions (Roman 2026-08-26): vendor/compliance items (unsigned
  # agreements, invoicing-rule changes) block POs — HIGH ticket to this ROLE.
  compliance_owner: sales
  # ── Non-PO work types (Roman approved 2026-08-27) ───────────────────────
  # Every charter@ ticket used to be stamped new_deal_po, so no routing rule
  # matched, no owner was derived, and it fell to whoever owns the inbox with
  # no SLA and no done-state. Measured over 845 tickets since 2026-06-01: a
  # ticket with a real category closed in a median of 0.25 days (92%); one in
  # the catch-all took 2.15 days (80%). Counts below are the open queue on
  # 2026-08-27, from the agent's own "Not a PO:" summaries.
  #
  # owner: a ROLE. category: an EXISTING hs_ticket_category option value —
  # never invent one, the enumeration is closed (ops/hubspot-schema).
  work_types:
    purchase_order:     { owner: charter_admin, priority: MEDIUM, category: new_deal_po }
    po_cancellation:    { owner: charter_admin, priority: HIGH,   category: cancel_service }
    # 7 open, median 14d. Schools chasing or confirming payment, year-end
    # reconciliation. Had no owner: was split across Kath, Paola, Mandy, Janelle.
    ar_followup:        { owner: charter_admin, priority: HIGH,   category: billing_refund }
    # 2 open. "Reissue under our new legal name before we can pay you" — the
    # Suncoast/Koby Wells case, $1,330 held up 10 days by a Bill To edit.
    invoice_correction: { owner: charter_admin, priority: HIGH,   category: billing_refund }
    # Unsigned agreements, COI, W-9. Blocks or reshapes POs, so it stays HIGH
    # and goes to sales — Roman moved the Granite Mountain COI there by hand.
    vendor_compliance:  { owner: sales,         priority: HIGH,   category: GENERAL_INQUIRY }
    # 11 open. Approvals, portal logins, welcome packets, renewals.
    vendor_onboarding:  { owner: charter_admin, priority: MEDIUM, category: GENERAL_INQUIRY }
    parent_info_reply:  { owner: charter_admin, priority: MEDIUM, category: new_deal_po }
    family_inquiry:     { owner: charter_sales, priority: HIGH,   category: GENERAL_INQUIRY }
    marketing_junk:     { owner: charter_admin, priority: LOW,    category: GENERAL_INQUIRY }
    scam:               { owner: charter_admin, priority: LOW,    category: GENERAL_INQUIRY }
    other:              { owner: charter_admin, priority: MEDIUM, category: GENERAL_INQUIRY }
  # ROLE mapping — functional keys name roles, never people (Roman 2026-08-14);
  # change the person here, not in code.
  # ANYTHING missing on PO intake (fields not in the PO, unmatched TOR/parent,
  # manual follow-ups, failed uploads) → a direct 🚩 DM to EACH of these, on top
  # of the ticket flags (Roman, 2026-08-11: "whenever something is missing it is
  # vital to send Roman and Kath Slack messages").
  missing_info_dms: [charter_admin, visionary]
  # "Is the family currently being tutored by us?" rule (Roman, 2026-08-11,
  # student-level, CALENDAR-ONLY): Yes = the PO's student has a lesson booked;
  # No = nothing on the calendar, period — the scheduling text goes out.
  # ONE text per KID: a multi-PO email (always one student) stamps "No" only on
  # its FIRST deal; each kid's own PO email gets its own text.
  # ALWAYS-filled deal properties — INTERNAL names verified against the portal
  # 2026-07-31. Ticket flags anything the PO didn't state so a human fills it.
  deal_property_map:
    student_first: "student_first_name"
    student_last: "student_last_name_if_diff_from_parent"   # label: Student Last Name
    grade: "student_grade"
    school: "student_school"
    parent_email: "parent_email"
    parent_phone: "parent_phone"
    tor_name: "teacher_of_record_name"     # "Name of the TOR for the student on this PO"
    tor_email: "teacher_of_record_email"   # PO email, or resolved from the matched TOR contact
  # The two charter service offerings (Roman, 2026-08-26). When a PO states an
  # amount but no rate, hours are computed ONLY if exactly one offering divides
  # the amount cleanly (whole sessions / quarter hours) — otherwise the deal is
  # flagged instead of guessed ($300 = 4 hrs OR 5 sessions; both fit). hours is
  # always stored as HOURS: a 4-session PO stamps 3.
  service_offerings:
    - rate: 75
      unit: hour            # the 99% case: $75/hour charter families
    - rate: 60
      unit: session         # the push: $60 per 45-minute session
      session_hours: 0.75
  # New PO + student has NO upcoming Teachworks lessons → post here (scheduling
  # nudge). Students already on the calendar stay quiet. Empty = #email-agent.
  no_lessons_channel: ""
  # Teachworks invoices are NOT creatable via the TW API (GET-only) — so each PO with
  # an amount spawns a due-dated HubSpot Task with all invoice fields (student, PO#,
  # amount, hours, Bill To from the PO) for a human to paste into TW's invoice form.
  invoice_task:
    enabled: true
    owner: charter_admin
    due_business_hours: 8    # STEP 1 is same-day: convert the PO to a TW invoice on receipt
    # STEP 2 (submitting to the school's ops system) is due at the END of the PO's
    # service month — stamped on lessons_fulfilled_date ("Expected Lessons Fulfilled
    # Date: date when lessons will be completed so Invoice can be submitted") and
    # prompted by the invoice sweep. Kath closes the loop by setting
    # invoice_submitted_date + moving the deal to its Invoice Submitted stage.
    invoice_due_property: "lessons_fulfilled_date"

# Teachworks notice → family-contact disambiguation. When two contacts share a last
# name, the student first name from the notice is matched against these (messy, multi-
# sibling) contact properties to pick the right family. Best-effort; unresolved = manual.
teachworks:
  student_name_properties:
    - student_last_name            # mislabeled: actually holds student 1 FIRST name
    - student_full_name_clone_     # "Student 2 Full Name"
    - student_3_full_name
    - student_4_full_name
    - pilibos_student_first_name
    - spotlight_student_first_name

# Internal staff email handling: route to the teammate the email is addressed to
# (e.g. "Hi Kath" → Kath), with a ticket. Falls back to `fallback` if unclear.
internal:
  domain: wetutorathome.com
  # The visionary seat does not own support tickets (Roman 2026-08-26) — anything
  # that would have landed on him goes to his second, the operations seat.
  fallback: operations

# Confidence + autonomy thresholds (LOCKED).
thresholds:
  min_confidence: 0.7        # below this → unknown, ticket only, no draft
  junk_auto_archive: 0.9     # junk below this → unknown instead of archive

# SLA escalation chain. 1x breach → the owner. 2x → level2 (supervisor who watches the
# owners). 3x → level3 (last resort) + ticket moved to Stuck. level2 is skipped if the
# supervisor is already the owner (no double-ping).
escalation:
  level2: scheduling_lead   # watches the schedulers
  level3: operations   # last resort

# Aging sweep (Roman 2026-08-26). The chain above walks the AUDIT LOG, so it only
# ever sees tickets the email/PO agents created — hand-made CRM tickets and call
# agent tickets were never swept at all, and four of Roman's sat 96 to 135 days
# with zero pings. This pass reads every OPEN ticket straight from HubSpot and
# keeps nagging on a cadence, so nothing goes quiet just because it is old.
# Reasoning sweep (Roman 2026-08-26). Age alone is the wrong trigger: a pure
# 24-hour rule measured on 2026-08-26 would have fired 102 DMs, 77 of them to
# Kath, and most of hers were PO tickets whose invoice already existed. So the
# pass reads the evidence (email direction, notes, SMS, calls, invoice proof),
# decides what state the ticket is really in, and only then closes or pesters.
# Pesters regardless of who owes the reply — an unanswered family is still ours.
reasoner:
  enabled: true
  # Roman approved 2026-08-28 after reading the 2026-08-27 dry run (Actions run
  # 33121995796): 158 tickets, 71 closes, and zero of the 13 hand-verified
  # unresolved tickets touched. Closing still needs confidence >= the threshold
  # below AND a verdict in RESOLVED / NO_ACTION / DUPLICATE.
  allow_close: true
  close_min_confidence: 0.85  # closing needs a second system, not a hunch
  owner_after_hours: 24
  supervisor_after_hours: 48
  last_resort_after_hours: 96
  repeat_every_hours: 24      # daily drumbeat once the ladder starts

aging_sweep:
  # OFF since 2026-08-28. Measured on Kath's DM channel: 88 bot messages in 24
  # hours, 59 of them from this sweep, and zero replies from her in the last 400
  # messages. A targeted question about a $1,330 invoice scrolled out of view
  # within a day. The reasoning sweep supersedes this — it asks whether a ticket
  # is really open before it says anything, where this one only asks how old it
  # is. Do not re-enable both at once.
  enabled: false
  nag_after_days: 7          # open + untouched this long → DM the owner
  supervisor_after_days: 14  # also DM level2
  last_resort_after_days: 30 # also DM level3
  repeat_every_days: 7       # re-nag this often — the chain above pings once per level and then goes silent forever

# Task-completion sweep (Roman 2026-08-28). Agents and humans create HubSpot
# Tasks, but nothing ever read one back — an overdue task made no noise
# anywhere. Weekday-morning digest to #agent-feedback (silent when clean),
# owner DM only past dm_after_days, weekly on-time/late scoreboard on Mondays.
task_sweep:
  enabled: true
  channel: "C0BL05MCJ4B"      # #agent-feedback (private; ID so the bot can post)
  # seats, not names. charter_admin added 2026-08-31: she holds every
  # PO→invoice task (the money path) and was the one seat nobody watched.
  # Safe to watch only because autoclose_invoice_tasks (below) clears the
  # phantoms first — ten of her open tasks were already-done invoices.
  monitor: [visionary, sales, charter_sales, scheduler_a_l, charter_admin]
  # An open "Convert PO to TW invoice" task whose deal already carries an
  # Invoice # is DONE — close it instead of nagging. false = report only.
  autoclose_invoice_tasks: true
  invoice_task_marker: "Convert PO to TW invoice"
  dm_after_days: 3            # overdue this long → DM the owner
  dm_repeat_days: 3           # re-DM cadence (audit-log-held, like aging_sweep)
  horizon_days: 30            # overdue past this = stale backlog: weekly count line
                              # only, never itemized/DM'd. On 2026-08-28 the four
                              # monitored owners held 717 open tasks, mostly
                              # months-to-years old; nagging those buries the signal.
  per_person_cap: 8           # digest lists at most this many tasks per owner
  dm_list_cap: 10             # a DM itemizes at most this many; ONE DM per owner per run
  weekly_stats_weekday: 0     # Monday → append last-7-days completion scoreboard

# Categories that NEVER get a drafted reply regardless of routing.draft.
no_draft_categories: [complaint, payment_dispute]

classifier:
  model: "claude-sonnet-4-6"
  max_tokens: 1500

# FUTURE: per-category auto-send graduation. No graduation criteria defined yet —
# do NOT build auto-send promotion logic. The only outbound the agent sends is the
# tutor-document receipt (templates/doc_receipt.md). Everything else is draft-only.
auto_send_graduation: {}
