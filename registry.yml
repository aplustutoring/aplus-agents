  # ───────────────────────── Call agent (ops/call_agent) ───────────────
  # V1: inbound calls on the main A+ line only. JustCall native AI transcripts
  # (no third-party fallback); require_recording consent guardrail; no
  # auto-created contacts. Deployment defaults to --dry-run until the repo
  # variable CALL_AGENT_LIVE=true.
  - id: call-agent
    name: Call agent — daily digest (~5:30 PM PT)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["30 0 * * * (17:30 PDT / 16:30 PST daily)"]
      workflow: .github/workflows/call-agent.yml
    entrypoint: ops/call_agent/call_agent.py
    reads:
      - JustCall                                # inbound calls + AI transcripts (v2.1)
      - HubSpot:contacts                        # phone match (search only)
      - ops/call_agent/state/state.json         # cursor + processed call IDs
    writes:
      - HubSpot:calls                           # Call engagement per matched call
      - HubSpot:contacts                        # key-property updates (log/overwrite/fill-only policies)
      - HubSpot:tasks                           # action items (default owner Paola)
      - HubSpot:notes                           # rubric evaluation on the contact (coaching.note_to_contact)
      - HubSpot:tickets                         # negative-sentiment check-in (Support Pipeline)
      - Slack                                   # daily digest + immediate negative-call alerts
      - ops/call_agent/state/state.json
    depends_on:
      - "secrets: JUSTCALL_API_KEY, JUSTCALL_API_SECRET, HUBSPOT_API_KEY, ANTHROPIC_API_KEY, SLACK_BOT_TOKEN or SLACK_WEBHOOK_URL"
      - ops/call_agent/config.yml
    notes: >
      Claude summarization + record-update proposal (claude-opus-4-7,
      structured outputs). Family-record loop: What's-going-on / what-we-can-
      do-to-help are dated append-logs; grade/school/subject overwrite;
      names/attribution fill-only; email/phone only on confirmed correction.
      Negative sentiment -> HIGH ticket + 2-business-day check-in task +
      private Slack alert. Coaching: every call scored against
      ops/call_agent/rubric.md, attributed via JustCall agent_name; cards to
      a private channel AND full evaluation as a Note on the matched contact
      (coaching.note_to_contact toggle; team-visible). Hang-ups (<200-char
      transcript) skipped. CHECK_ONLY
      smoke mode + --dry-run. Unmatched callers go to digest triage (never
      auto-created). monitored_numbers is a list for future lines — confirm
      recording disclosure before adding any.

  # ───────────────────────── Feedback agent (ops/feedback-agent) ───────
  # V1 "the doorbell for demotions": #agent-feedback Slack channel -> Events
  # relay -> repository_dispatch. Classifies freeform reports against THIS
  # file's vocabulary, files corrections as PRs, drafts tickets for
  # BROKEN/critical, and runs the #AP011 DEMOTE fast path (one-click registry
  # PR, human-executed). Mechanism behind the /corrections loop (#AP008).
  - id: feedback-agent
    name: "Feedback agent — #agent-feedback intake + Friday digest"
    owner: roman@wetutorathome.com
    status: active
    probation: draft            # ships at Draft; graduates filing after 20 clean reports
    trigger:
      type: event
      events: [repository_dispatch, workflow_dispatch, pull_request, cron]
      source: >
        Slack Events relay (ops/feedback-agent/relay/apps-script.gs) fires
        repository_dispatch feedback-report per human message in
        #agent-feedback; correction-PR merges trigger the close-loop reply;
        Friday 23:00 UTC (16:00 PDT) cron posts the weekly digest.
      workflows:
        - .github/workflows/feedback-intake.yml
        - .github/workflows/feedback-digest.yml
        - .github/workflows/feedback-close-loop.yml
    entrypoint: ops/feedback-agent/feedback_agent.py
    reads:
      - Slack                                  # #agent-feedback messages (via relay payload) + user profiles
      - registry.yml                           # classification vocabulary + demote target
      - ops/feedback-agent/state/state.json    # dedupe, pending clarifications, report log
    writes:
      - Slack                                  # thread acks, clarifying questions, demote alerts, Friday digest
      - corrections/<agent>/                   # structured correction files, as PRs (Roman merges)
      - registry.yml                           # DEMOTE probation flip, as a one-click PR (human merges)
      - HubSpot:tickets                        # BROKEN/critical — DRAFTED in-thread until graduation (#AP007 conventions)
      - ops/feedback-agent/state/              # state.json + digest-latest.md (Integrator Monday-brief input)
    depends_on:
      - "secrets: ANTHROPIC_API_KEY, SLACK_BOT_TOKEN, HUBSPOT_API_KEY"
      - "repo variable FEEDBACK_AGENT_LIVE (dry-run until true)"
      - ops/feedback-agent/config.yml
    notes: >
      Claude classification (structured outputs): agent (registry id or
      UNKNOWN -> Zapier-census flag) x type (BROKEN/WRONG/ANNOYING/IDEA/
      DEMOTE) x severity (critical/normal/low). Acks by reporter first name;
      one clarifying question max; never argues or defends an agent. FERPA:
      student/family specifics stay in the thread — correction stores the
      link (#AP008). Digests aggregate by agent, never by person. DEMOTE
      registry-flip stays human-executed until the Fleet Manager exists.

  # ───────────────────────── Email / inbox-ops engine ──────────────────
  # Separate repo: github.com/aplustutoring/aplus-email. Runs on GitHub Actions
  # (no always-on server). Triages admin@wetutorathome.com + HubSpot
  # Conversations (portal 6312752). Draft-only except two locked auto-actions
  # (junk->archive, tutor_document->fixed receipt). FERPA-safe enrichment.
  - id: email-triage
    name: Inbox triage
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["every 15 min during business hours + hourly"]
      repo: aplustutoring/aplus-agents
      workflow: .github/workflows/email-triage.yml
    entrypoint: email/src/main.py
    reads: [HubSpot:conversations, HubSpot:contacts, Teachworks]
    writes: [HubSpot:tickets, HubSpot:conversations(comment), Slack]
    depends_on: [email/rules.md, email/config.yaml, "Claude Sonnet classifier"]
  - id: email-sla-sweep
    name: SLA sweep
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["hourly"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-sla-sweep.yml}
    entrypoint: email/src/sla_sweep.py
    reads: [HubSpot:tickets]
    writes: [Slack, HubSpot:tickets]
  - id: email-weekly-digest
    name: Weekly digest
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["Mon 8 AM PT"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-weekly-digest.yml}
    entrypoint: email/src/digest.py
    reads: [HubSpot:tickets, email/state/audit_log.jsonl]
    writes: [Slack]
  - id: email-daily-summary
    name: Daily summary (6 PM PT DM)
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["daily 6 PM PT"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-daily-summary.yml}
    entrypoint: email/src/daily_summary.py
    reads: [email/state/audit_log.jsonl, HubSpot:tickets]
    writes: [Slack]
  - id: email-hourly-update
    name: Hourly launch-monitoring update
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["hourly, business hours"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-hourly-update.yml}
    entrypoint: email/src/hourly_update.py
    reads: [email/state/audit_log.jsonl]
    writes: [Slack]
  - id: email-po-inbox
    name: Charter PO inbox (charter@wetutorathome.com)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["every 15 min during business hours + hourly"]
      repo: aplustutoring/aplus-agents
      workflow: .github/workflows/email-po-inbox.yml
    entrypoint: email/src/po_inbox.py
    reads: ["Gmail:charter@ (incl. PDF/image PO attachments)", HubSpot:deals, HubSpot:contacts, "Teachworks:lessons (upcoming-calendar check)"]
    writes:
      - "HubSpot:deals (create; Level Up A 88841552 routing; props: po_number, number_of_hours_in_this_po, student_first_name, student_last_name_if_diff_from_parent, student_grade, student_school, parent_email, parent_phone, lessons_fulfilled_date)"
      - "HubSpot:contacts (find-or-create parent + TOR, associate to deal)"
      - "HubSpot:files+notes (PO PDF pinned to the deal)"
      - "HubSpot:tickets+tasks (Kath ticket; same-day convert-PO-to-TW-invoice task)"
      - "Gmail:labels (drafts only on non-PO mail — POs never get replies)"
      - "Slack (Kath DM; URGENT duplicate-PO alert; no-lessons scheduling nudge)"
    depends_on: [email/config.yaml, "Claude Sonnet PO extractor"]
    notes: Chains deal_sync.sync_deal for the new deal in the SAME run (no cron lag).
  - id: email-deal-sync
    name: Deal sync (HubSpot → Teachworks) + invoice sweep
    owner: roman@wetutorathome.com
    status: active                     # LIVE 2026-08-03 (12-day pilot, backlog replayed)
    trigger:
      type: cron
      schedule: ["every 15 min during business hours + hourly"]
      repo: aplustutoring/aplus-agents
      workflow: .github/workflows/email-deal-sync.yml
    entrypoint: email/src/deal_sync.py
    reads: [HubSpot:deals, HubSpot:contacts, "Teachworks:customers/students/lessons"]
    writes:
      - "Teachworks:customers+students (family upsert by email; per-pipeline billing; guards: charter contact must match deal-name parent, internal domains skipped)"
      - "Slack (needs-review flags; invoice-sweep submit prompts to Kath)"
    depends_on: [email/config.yaml, email/src/invoice_sweep.py]
    notes: >
      Invoice sweep (daily 9 AM PT inside this workflow): active charter PO deals —
      attended TW hours >= PO hours → prompt Kath to submit to the school's ops
      system now, else prompt at end of PO month (lessons_fulfilled_date). Skips
      deals with invoice_submitted_date set or in an Invoice Submitted stage.
      Manual tools: FORCE_DEAL_ID / FORCE_CONTACT_EMAIL / FORCE_STUDENT_FIRST
      workflow inputs (one-deal real sync).

