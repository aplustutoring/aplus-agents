    notes: >
      Catches work stranded outside main (2026-08-05 incidents: PR #47 sat
      unmerged for a week; a CallRail matching fix sat unpushed locally for
      16 days). Companion LOCAL mode (--local) runs from Roman's Mac crontab
      daily — Actions cannot see never-pushed local commits.

