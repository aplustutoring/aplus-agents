    owner: roman@wetutorathome.com
    status: manual
    trigger:
      type: workflow_dispatch
      workflow: .github/workflows/messenger.yml
    entrypoint: ops/messenger/messenger.py
    reads:
      - HubSpot                             # list memberships + contact merge props
    writes:
      - HubSpot                             # DRAFT marketing-email clone (email channel)
      - JustCall                            # outbound SMS (sms channel, live only)
    depends_on:
      - "secrets: HUBSPOT_PRIVATE_APP_TOKEN, JUSTCALL_API_KEY, JUSTCALL_API_SECRET"
      - ops/messenger/config.yml
      - ops/messenger/templates/
