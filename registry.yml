# Source of truth for the agent fleet. If it's not here, it doesn't exist.
#
# DATA sources of truth (what each engine reads/writes against):
#   HubSpot    — FAMILIES: all family/contact information AND all communication
#                (contacts, deals, tickets, conversations, blog posts, properties)
#   Teachworks — LESSONS: all lesson, scheduling, and attendance data
# Engines sync FROM Teachworks (lessons) INTO HubSpot (family record); HubSpot is
# where humans act. Never treat a local cache/sheet as authoritative over these.
#
# Spans the whole fleet across repos/machines, not just this repo:
#   marketing  — aplus-agents (this repo): B2B blogs + B2C spotlights
#   email      — aplus-agents/email (this repo, GitHub Actions since the 2026-07-22
#                cutover): inbox/customer-comms ops incl. charter-PO intake
#   sync       — aplus-agents/ops/scorecard (this repo, GitHub Actions): Teachworks
#                -> HubSpot data sync. Migrated 2026-06 from ~/aplus-sync local cron.
#   charter    — NOT BUILT: discussed B2B prospecting/sales engine, no live automation
#                (earlier ~/charter_tool experiment dropped 2026-06-29)
#
# Built from the actual repo inventory on the restructure/aplus-agents-split
# branch (2026-06). One entry per live agent/script behind a workflow, plus
# external entrypoints that are part of the fleet but not yet in this repo.
#
# Fields:
#   id          stable slug
#   engine      which engine this agent belongs to — the grouping used by
#               docs/FLEET.md (generated) and ARCHITECTURE.md. Set it on every
#               new entry; ops/fleet-health/registry_check.py fails without it.
#   name        human label (matches the workflow `name:` where one exists)
#   owner       responsible human
#   status      active | manual | deprecated | unverified
#   trigger     cron (with PT meaning) or event description
#   entrypoint  repo-relative path, or absolute for external agents
#   reads       HubSpot objects / Teachworks / Drive / Sheets it consumes
#   writes      what it mutates (HubSpot, Slack, repo state, Sheets)
#   depends_on  skills/scripts/state it needs to function
#   probation   OPTIONAL: draft | autonomous. draft = nothing goes out without
#               human approval. Set to draft by the feedback-agent DEMOTE path
#               (#AP011 — honored first, reviewed after); absence means the
#               agent runs at whatever autonomy its own workflow encodes.
#   zaps        OPTIONAL: Zapier zap names owned by this agent — the DEMOTE
#               path lists them for pausing (none listed = cross-check the
#               Zapier census in ops/fleet-health/audit/zapier-census.md)
#
# Times: HubSpot is the single source of truth. Schedules carry both a PDT and
# a PST cron so the wall-clock hour is stable across DST.
#
# TIMEZONE CONVENTION (fleet-wide, 2026-07): agents think in Pacific Time.
# Every workflow sets TZ=America/Los_Angeles, so naive datetime.now() /
# date.today() in scripts resolve to PT — human-facing labels (Slack, Sheets,
# HubSpot notes/tasks, Monday groups) and date-window logic stay in sync.
# Machine-facing values (state cursors, API epoch params, audit logs) stay
# explicit UTC via datetime.now(timezone.utc). Crons in workflow files remain
# UTC. Never hardcode a fixed UTC offset for PT — use ZoneInfo
# ("America/Los_Angeles") when an explicit zone is needed (DST-aware).

agents:
  # ───────────────────────── B2B content engine ─────────────────────────
  - id: topic-gen
    engine: B2B blogs
    name: Topic generation (Thursday 5 PM PT)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["0 0 * * 5 (17:00 PDT Thu)", "0 1 * * 5 (17:00 PST Thu)"]
      workflow: .github/workflows/topic-gen.yml
    entrypoint: marketing/scripts/b2b/topic_gen.py
    reads:
      - marketing/state/topic-registry.json   # anti-repeat anchors/candidates
    writes:
      - marketing/state/topic-queue.json       # slate, AUTO-APPROVED
      - marketing/state/history.json
    depends_on:
      - skill:aplus-research
      - marketing/scripts/b2b/topic-registry.py
      - marketing/scripts/shared/state.py

  - id: content-build
    engine: B2B blogs
    name: Content build (Saturday — approved slate → HubSpot drafts)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["0 15 * * 6 (08:00 PDT Sat)", "0 16 * * 6 (08:00 PST Sat)"]
      workflow: .github/workflows/content-build.yml
    entrypoint: marketing/scripts/b2b/content-build.py
    reads:
      - marketing/state/topic-queue.json        # the approved slate
      - HubSpot:blog_posts                       # contentGroupId 12422338726 (B2B blog)
    writes:
      - HubSpot:blog_posts                       # draft posts via /cms/v3/blogs/posts
      - Slack                                    # bundle delivery
      - marketing/state/topic-queue.json
      - marketing/state/history.json
    depends_on:
      - marketing/scripts/shared/publish-to-hubspot.py
      - marketing/scripts/b2b/deliver-to-slack.py
      - marketing/scripts/b2b/build-graphics.py
      - marketing/scripts/shared/composite-logo.py
      - marketing/scripts/shared/embed-pull-quotes.py
      - marketing/scripts/b2b/fix-links.py
      - skill:aplus-blog-longform
      - skill:aplus-brand-check
      - skill:aplus-fact-check

  - id: blog-metrics
    engine: B2B blogs
    name: Blog metrics scorecard (Monday 9 AM PT)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["0 16 * * 1 (09:00 PDT Mon)", "0 17 * * 1 (09:00 PST Mon)"]
      workflow: .github/workflows/blog-metrics.yml
    entrypoint: marketing/scripts/b2b/blog-metrics.py
    reads:
      - marketing/state/history.json            # content_build records → which posts
      - HubSpot:blog_posts                       # live URLs + analytics
    writes:
      - Slack                                    # metrics scorecard post (unverified target)
    depends_on:
      - marketing/scripts/shared/state.py

  # ───────────────────────── B2C spotlight engine ───────────────────────
  - id: spotlight-orchestrator
    engine: B2C spotlights
    name: Spotlight Orchestrator
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: event
      events: [repository_dispatch, workflow_dispatch]
      source: Drive watcher (marketing/scripts/watcher/apps-script.gs) fires repository_dispatch with the intake folder ID
      workflow: .github/workflows/spotlight-orchestrator.yml
    entrypoint: marketing/scripts/b2c/spotlight_orchestrator.py
    reads:
      - GoogleDrive                              # intake folder, via download-drive-folder.py → /tmp/spotlight-source
      - marketing/data/partner-schools.md        # demographics cache (self-populating)
      - HubSpot:contacts                          # auto-discovery (Phase 0)
    writes:
      - HubSpot:blog_posts                       # case-study draft, contentGroupId 81499394054
      - Slack                                    # delivery to Paola
      - marketing/data/partner-schools.md        # writes back derived demographics
      - marketing/aplus-content/<bundle>/         # generated bundle (gitignored)
    depends_on:
      - marketing/scripts/watcher/download-drive-folder.py
      - marketing/scripts/b2c/build-case-study-hero-card.py
      - marketing/scripts/b2c/build-case-study-topic-graphic.py
      - marketing/scripts/b2c/build-case-study-pull-quotes.py
      - marketing/scripts/b2c/build-case-study-ig-carousel.py
      - marketing/scripts/b2c/build-instagram-stories.py
      - marketing/scripts/b2c/build-case-study-facebook.py
      - marketing/scripts/shared/composite-logo.py
      - marketing/scripts/shared/publish-to-hubspot.py
      - skill:aplus-spotlight-orchestrator
      - skill:aplus-spotlight-case-study
      - skill:aplus-b2c-hashtag-analyst

  - id: rerender-textstory
    engine: B2C spotlights
    name: Re-render textstories for a bundle
    owner: roman@wetutorathome.com
    status: manual
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/rerender-textstory.yml
    entrypoint: marketing/scripts/b2c/build-case-study-textstory.py
    reads:
      - bundle artifact (passed via --bundle)
      - marketing/assets/sfx/                     # SFX bed
    writes:
      - Slack                                    # delivers re-rendered textstory
    depends_on:
      - marketing/scripts/b2c/textstory/

  # ───────────────────────── Case-study log sheet ───────────────────────
  - id: backfill-logsheet
    engine: B2C spotlights
    name: Backfill case-study log sheet
    owner: roman@wetutorathome.com
    status: manual
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/backfill-logsheet.yml
    entrypoint: marketing/scripts/b2c/sheet_log.py
    reads:
      - GoogleDrive                              # bundle artifacts
    writes:
      - GoogleSheets                             # case-study log sheet (service account)
    depends_on:
      - service_account: spotlight-watcher@a-plus-spotlight-watcher.iam.gserviceaccount.com

  - id: verify-logsheet
    engine: B2C spotlights
    name: Verify case-study log sheet
    owner: roman@wetutorathome.com
    status: manual
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/verify-logsheet.yml
    entrypoint: marketing/scripts/b2c/sheet_log.py   # invoked with --check
    reads:
      - GoogleSheets                             # connectivity check only
    writes: []
    depends_on:
      - service_account: spotlight-watcher@a-plus-spotlight-watcher.iam.gserviceaccount.com

  # ───────────────────────── Deprecated (kept for dispatch) ─────────────
  - id: blog-publish
    engine: B2B blogs
    name: Blog publish (DEPRECATED — superseded by content-build)
    owner: roman@wetutorathome.com
    status: deprecated
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/blog-publish.yml
    entrypoint: marketing/scripts/b2b/blog_publish.py
    reads: [marketing/state/topic-queue.json]
    writes: [HubSpot:blog_posts, marketing/state/topic-queue.json, marketing/state/history.json]
    depends_on: [marketing/scripts/shared/publish-to-hubspot.py]

  - id: approval-deadline
    engine: B2B blogs
    name: Approval deadline check (DEPRECATED — approval gate removed)
    owner: roman@wetutorathome.com
    status: deprecated
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/approval-deadline.yml
    entrypoint: marketing/scripts/b2b/approval_deadline.py
    reads: [marketing/state/topic-queue.json]
    writes: [marketing/state/topic-queue.json, marketing/state/history.json]
    depends_on: [marketing/scripts/shared/state.py]

  - id: approval-poll
    engine: B2B blogs
    name: Approval poll (DEPRECATED — approval gate removed)
    owner: roman@wetutorathome.com
    status: deprecated
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/approval-poll.yml
    entrypoint: marketing/scripts/b2b/await-slack-approval.py
    reads: [marketing/state/topic-queue.json]
    writes: [marketing/state/topic-queue.json, marketing/state/history.json]
    depends_on: [marketing/scripts/shared/state.py]

  # ───────────────────────── Data sync (ops/scorecard) ─────────────────
  # Migrated 2026-06 from the local-cron folder ~/aplus-sync INTO this repo
  # (Tier B -> Tier A). Now runs on GitHub Actions; secrets are repo secrets.
  # Stateless (no state committed back). Cutover note: the 3 local crontab
  # lines are removed once the Actions runs are verified green.
  - id: scorecard-weekly-sync
    engine: Data sync
    name: Weekly scorecard sync
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["0 17 * * 1 (10:00 PDT / 09:00 PST Mon)"]
      workflow: .github/workflows/scorecard-weekly.yml
    entrypoint: ops/scorecard/aplus_weekly_sync.py
    reads: [Teachworks]                       # lessons
    writes: [HubSpot, Monday]                  # scorecard
    depends_on: ["secrets: TEACHWORKS_API_KEY, HUBSPOT_API_KEY, MONDAY_API_KEY"]
    notes: CHECK_ONLY smoke mode for CI (no DRY_RUN). WEEK_START/WEEK_END manual override.

  - id: retention-sync
    engine: Data sync
    name: Retention sync
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["0 16 * * 1 (09:00 PDT / 08:00 PST Mon)"]
      workflow: .github/workflows/scorecard-retention.yml
    entrypoint: ops/scorecard/aplus_retention_sync.py
    reads: [Teachworks]
    writes: [GoogleSheets, Slack]
    depends_on:
      - "secrets: TEACHWORKS_API_KEY, SLACK_WEBHOOK_URL, RETENTION_SA_JSON"
      - service_account: aplus-retention@a-plus-retention.iam.gserviceaccount.com
    notes: Has built-in DRY_RUN. SA JSON written from secret at runtime.

  - id: missed-lessons-sync
    engine: Data sync
    name: Missed-lessons sync
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["55 15 * * 1 (08:55 PDT / 07:55 PST Mon)"]
      workflow: .github/workflows/scorecard-missed-lessons.yml
    entrypoint: ops/scorecard/aplus_missed_lessons_sync.py
    reads: [Teachworks]
    writes: [Monday]
    depends_on: ["secrets: TEACHWORKS_API_KEY, MONDAY_API_KEY"]
    notes: CHECK_ONLY smoke mode for CI (no DRY_RUN).

  # ───────────────────────── Call agent (ops/call_agent) ───────────────
  # V1: inbound calls on the main A+ line only. JustCall native AI transcripts
  # (no third-party fallback); require_recording consent guardrail; no
  # auto-created contacts. Deployment defaults to --dry-run until the repo
  # variable CALL_AGENT_LIVE=true.
  - id: call-agent
    engine: Call agent
    name: Call agent — daily digest (~5:30 PM PT)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["30 0 * * * (17:30 PDT / 16:30 PST daily)"]
      workflow: .github/workflows/call-agent.yml
    entrypoint: ops/call_agent/call_agent.py
    reads:
      - JustCall                                # inbound calls + AI transcripts (v2.1)
      - HubSpot:contacts                        # phone match (search only)
      - ops/call_agent/state/state.json         # cursor + processed call IDs
    writes:
      - HubSpot:calls                           # Call engagement per matched call
      - HubSpot:contacts                        # key-property updates (log/overwrite/fill-only policies)
      - HubSpot:tasks                           # action items (default owner Paola)
      - HubSpot:notes                           # rubric evaluation on the contact (coaching.note_to_contact)
      - HubSpot:tickets                         # negative-sentiment check-in (Support Pipeline)
      - Slack                                   # daily digest + immediate negative-call alerts
      - ops/call_agent/state/state.json
    depends_on:
      - "secrets: JUSTCALL_API_KEY, JUSTCALL_API_SECRET, HUBSPOT_API_KEY, ANTHROPIC_API_KEY, SLACK_BOT_TOKEN or SLACK_WEBHOOK_URL"
      - ops/call_agent/config.yml
    notes: >
      Claude summarization + record-update proposal (claude-opus-4-7,
      structured outputs). Family-record loop: What's-going-on / what-we-can-
      do-to-help are dated append-logs; grade/school/subject overwrite;
      names/attribution fill-only; email/phone only on confirmed correction.
      Negative sentiment -> HIGH ticket + 2-business-day check-in task +
      private Slack alert. Coaching: every call scored against
      ops/call_agent/rubric.md, attributed via JustCall agent_name; cards to
      a private channel AND full evaluation as a Note on the matched contact
      (coaching.note_to_contact toggle; team-visible). Hang-ups (<200-char
      transcript) skipped. CHECK_ONLY
      smoke mode + --dry-run. Unmatched callers go to digest triage (never
      auto-created). monitored_numbers is a list for future lines — confirm
      recording disclosure before adding any.

  # ───────────────────────── Feedback agent (ops/feedback-agent) ───────
  # V1 "the doorbell for demotions": #agent-feedback Slack channel -> Events
  # relay -> repository_dispatch. Classifies freeform reports against THIS
  # file's vocabulary, files corrections as PRs, drafts tickets for
  # BROKEN/critical, and runs the #AP011 DEMOTE fast path (one-click registry
  # PR, human-executed). Mechanism behind the /corrections loop (#AP008).
  - id: feedback-agent
    engine: Feedback agent
    name: "Feedback agent — #agent-feedback intake + Friday digest"
    owner: roman@wetutorathome.com
    status: active
    probation: draft            # ships at Draft; graduates filing after 20 clean reports
    trigger:
      type: event
      events: [repository_dispatch, workflow_dispatch, pull_request, cron]
      source: >
        Slack Events relay (ops/feedback-agent/relay/apps-script.gs) fires
        repository_dispatch feedback-report per human message in
        #agent-feedback; correction-PR merges trigger the close-loop reply;
        Friday 23:00 UTC (16:00 PDT) cron posts the weekly digest.
      workflows:
        - .github/workflows/feedback-intake.yml
        - .github/workflows/feedback-digest.yml
        - .github/workflows/feedback-close-loop.yml
    entrypoint: ops/feedback-agent/feedback_agent.py
    reads:
      - Slack                                  # #agent-feedback messages (via relay payload) + user profiles
      - registry.yml                           # classification vocabulary + demote target
      - ops/feedback-agent/state/state.json    # dedupe, pending clarifications, report log
    writes:
      - Slack                                  # thread acks, clarifying questions, demote alerts, Friday digest
      - corrections/<agent>/                   # structured correction files, as PRs (Roman merges)
      - registry.yml                           # DEMOTE probation flip, as a one-click PR (human merges)
      - HubSpot:tickets                        # BROKEN/critical — DRAFTED in-thread until graduation (#AP007 conventions)
      - ops/feedback-agent/state/              # state.json + digest-latest.md (Integrator Monday-brief input)
    depends_on:
      - "secrets: ANTHROPIC_API_KEY, SLACK_BOT_TOKEN, HUBSPOT_API_KEY"
      - "repo variable FEEDBACK_AGENT_LIVE (dry-run until true)"
      - ops/feedback-agent/config.yml
    notes: >
      Claude classification (structured outputs): agent (registry id or
      UNKNOWN -> Zapier-census flag) x type (BROKEN/WRONG/ANNOYING/IDEA/
      DEMOTE) x severity (critical/normal/low). Acks by reporter first name;
      one clarifying question max; never argues or defends an agent. FERPA:
      student/family specifics stay in the thread — correction stores the
      link (#AP008). Digests aggregate by agent, never by person. DEMOTE
      registry-flip stays human-executed until the Fleet Manager exists.

  # The execution half of the propose->approve loop (2026-08-04, per Roman):
  # an approver green-lights a fix proposal in the #agent-feedback thread, the
  # intake fires this dispatch, a coding agent implements it on a fix/ branch
  # and opens a PR. Approval buys execution, not deployment — Roman merges.
  - id: feedback-fix
    engine: Feedback agent
    name: Feedback agent — execute approved fix
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: event
      events: [repository_dispatch]
      source: >
        feedback-fix-approved dispatch from the feedback agent, carrying the
        correction path, diagnosis, approved plan, branch and Slack thread.
      workflow: .github/workflows/feedback-fix.yml
    entrypoint: anthropics/claude-code-action@v1   # + ops/feedback-agent/feedback_agent.py --mode fix-notify
    reads:
      - corrections/<agent>/                  # the reporter's own words + context
      - registry.yml                          # entrypoint + dependencies of the target agent
      - the agent's own source
    writes:
      - "GitHub: fix/ branch + PR to main (never merged by the agent)"
      - Slack                                 # links the PR (or the failure) back in the thread
    depends_on:
      - "secrets: ANTHROPIC_API_KEY, SLACK_BOT_TOKEN (GITHUB_TOKEN ambient)"
    notes: >
      Confirms or corrects the diagnosis before changing anything; stays scoped
      to the approved plan (implements the honest minimal version and says so if
      the real fix differs). Forbidden from touching registry.yml or workflows.
      Branches start from current main, not the dispatch-time SHA. Excluded from
      the fleet-retry sweeper — paid coding-agent runs are never blindly retried.

  # ───────────────────────── Fleet retry sweeper (ops/fleet-health) ────
  # Failed runs get 3 automatic retries (~20 min apart — rides out platform
  # outages like 2026-08-06's) before ONE Slack alert pings the approvers.
  # GitHub's own per-failure emails are account-level noise; turn off at
  # github.com/settings/notifications once this is live.
  - id: fleet-retry
    engine: Fleet health
    name: Fleet retry sweeper (every 20 min)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["7,27,47 * * * * (every 20 min, offset from agent crons)"]
      workflow: .github/workflows/fleet-retry.yml
    entrypoint: ops/fleet-health/retry/sweep.py
    reads:
      - GitHub:actions_runs                     # last 24h of completed runs
      - ops/feedback-agent/config.yml           # alert routing (slack.alerts_to)
    writes:
      - GitHub:actions_runs                     # rerun-failed-jobs (attempts 2-4)
      - Slack                                   # one alert per exhausted run
    depends_on:
      - "secrets: SLACK_BOT_TOKEN"
    notes: >
      Excludes itself and the approved-fix executor (paid coding-agent runs
      are never blindly retried). Alert window matches the sweep interval so
      each exhausted run alerts exactly once.

  # ───────────────────────── Email / inbox-ops engine ──────────────────
  # Separate repo: github.com/aplustutoring/aplus-email. Runs on GitHub Actions
  # (no always-on server). Triages admin@wetutorathome.com + HubSpot
  # Conversations (portal 6312752). Draft-only except two locked auto-actions
  # (junk->archive, tutor_document->fixed receipt). FERPA-safe enrichment.
  - id: email-triage
    engine: Email / inbox ops
    name: Inbox triage
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["every 15 min during business hours + hourly"]
      repo: aplustutoring/aplus-agents
      workflow: .github/workflows/email-triage.yml
    entrypoint: email/src/main.py
    reads: [HubSpot:conversations, HubSpot:contacts, Teachworks]
    writes: [HubSpot:tickets, HubSpot:conversations(comment), Slack]
    depends_on: [email/rules.md, email/config.yaml, "Claude Sonnet classifier"]
  - id: email-sla-sweep
    engine: Email / inbox ops
    name: SLA sweep
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["hourly"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-sla-sweep.yml}
    entrypoint: email/src/sla_sweep.py
    reads: [HubSpot:tickets]
    writes: [Slack, HubSpot:tickets]
  - id: email-weekly-digest
    engine: Email / inbox ops
    name: Weekly digest
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["Mon 8 AM PT"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-weekly-digest.yml}
    entrypoint: email/src/digest.py
    reads: [HubSpot:tickets, email/state/audit_log.jsonl]
    writes: [Slack]
  - id: email-daily-summary
    engine: Email / inbox ops
    name: Daily summary (6 PM PT DM)
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["daily 6 PM PT"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-daily-summary.yml}
    entrypoint: email/src/daily_summary.py
    reads: [email/state/audit_log.jsonl, HubSpot:tickets]
    writes: [Slack]
  - id: email-hourly-update
    engine: Email / inbox ops
    name: Hourly launch-monitoring update
    owner: roman@wetutorathome.com
    status: active
    trigger: {type: cron, schedule: ["hourly, business hours"], repo: aplustutoring/aplus-agents, workflow: .github/workflows/email-hourly-update.yml}
    entrypoint: email/src/hourly_update.py
    reads: [email/state/audit_log.jsonl]
    writes: [Slack]
  - id: email-po-inbox
    engine: Email / inbox ops
    name: Charter PO inbox (charter@wetutorathome.com)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["every 15 min during business hours + hourly"]
      repo: aplustutoring/aplus-agents
      workflow: .github/workflows/email-po-inbox.yml
    entrypoint: email/src/po_inbox.py
    reads: ["Gmail:charter@ (incl. PDF/image PO attachments)", HubSpot:deals, HubSpot:contacts, "Teachworks:lessons (upcoming-calendar check)"]
    writes:
      - "HubSpot:deals (create; Level Up A 88841552 routing; props: po_number, number_of_hours_in_this_po, student_first_name, student_last_name_if_diff_from_parent, student_grade, student_school, parent_email, parent_phone, lessons_fulfilled_date)"
      - "HubSpot:contacts (find-or-create parent + TOR, associate to deal)"
      - "HubSpot:files+notes (PO PDF pinned to the deal)"
      - "HubSpot:tickets+tasks (Kath ticket; same-day convert-PO-to-TW-invoice task)"
