      applies). SMS = JustCall, sales/conference number routing, sms_opt_out
      + STOP-line + 9-20 PT quiet-hours guardrails. Built 2026-08-14; Slack
      front door + STOP ingestion are phase 2 (see ops/messenger/README.md).

  - id: campaign-launch
    engine: Messenger
    name: Campaign launch (Monday enrollments)
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: cron
      schedule: ["0 16 * * * (09:00 PDT / 08:00 PST daily — gated in enroll.py)"]
      events: [workflow_dispatch]           # inputs: confirm=LAUNCH, force (skip the gates)
      workflow: .github/workflows/monday-launch.yml
    entrypoint: ops/messenger/enroll.py
    reads:
      - ops/messenger/campaign.yml          # armed flag, launch_date, {list_id, workflow_id} pairs
      - HubSpot                              # list members' emails
    writes:
      - HubSpot                              # workflow enrollments (automation v2), per-contact result log
    depends_on:
      - "secrets: HUBSPOT_PRIVATE_APP_TOKEN"
      - ops/messenger/campaign.yml
      - ops/messenger/templates/
    notes: >
      The daily cron is a no-op unless campaign.yml has `armed: true` AND today
      (PT) == launch_date — arming is a deliberate config change in a PR, so a
      launch is a human decision that the cron merely executes. Dry-run default
      on manual dispatch; live needs confirm=LAUNCH. Already-enrolled contacts
      error harmlessly. First use: charter 26/27 re-engagement pilot, 2026-08-18
      (list 3146 -> workflow 1868435042). See ops/messenger/CAMPAIGN-2026-08-17.md.
