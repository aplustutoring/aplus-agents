  # ───────────────────────── HubSpot schema (ops/hubspot-schema) ───────
  # The property registry: properties.yml declares every custom property the
  # fleet writes; create_properties.py syncs it INTO the portal (additive
  # only — never deletes). First entries: ticket_source + source_agent
  # (#AP007 ticket conventions), created 2026-07-27.
  - id: hubspot-schema
    name: HubSpot schema sync (manual)
    owner: roman@wetutorathome.com
    status: manual
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/hubspot-schema.yml
    entrypoint: ops/hubspot-schema/create_properties.py
    reads:
      - ops/hubspot-schema/properties.yml   # the property registry
      - registry.yml                        # options_from: registry -> source_agent enum
      - HubSpot                             # existing groups/properties/options
    writes:
      - HubSpot                             # missing groups/properties/enum options only
    depends_on:
      - "secrets: HUBSPOT_API_KEY (crm.schemas.tickets.write scope)"
    notes: >
      Idempotent + additive only. Schema changes are deliberate: edit
      properties.yml in a PR, merge, run the workflow (dry-run by default).
      Re-run after registering a new agent so source_agent picks up the new
      option. CHECK_ONLY smoke mode.
