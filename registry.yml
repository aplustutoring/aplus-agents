  # ───────────────────────── HubSpot schema (ops/hubspot-schema) ───────
  # The property registry: properties.yml declares every custom property the
  # fleet writes; create_properties.py syncs it INTO the portal (additive
  # only — never deletes). First entries: ticket_source + source_agent
  # (#AP007 ticket conventions), created 2026-07-27.
  - id: hubspot-schema
    engine: Fleet health
    name: HubSpot schema sync (manual)
    owner: roman@wetutorathome.com
    status: manual
    trigger:
      type: event
      events: [workflow_dispatch]
      workflow: .github/workflows/hubspot-schema.yml
    entrypoint: ops/hubspot-schema/create_properties.py
    reads:
      - ops/hubspot-schema/properties.yml   # the property registry
      - registry.yml                        # options_from: registry -> source_agent enum
      - HubSpot                             # existing groups/properties/options
    writes:
      - HubSpot                             # missing groups/properties/enum options only
    depends_on:
      - "secrets: HUBSPOT_API_KEY (crm.schemas.tickets.write scope)"
    notes: >
      Idempotent + additive only. Schema changes are deliberate: edit
      properties.yml in a PR, merge, run the workflow (dry-run by default).
      Re-run after registering a new agent so source_agent picks up the new
      option. CHECK_ONLY smoke mode.

  # ───────────────────────── Registry watcher (ops/fleet-health) ───────
  # The mechanism that makes this file's first rule enforceable, plus the
  # generator for docs/FLEET.md. Added 2026-08-20 after an audit found nine
  # live workflows with no entry here — three writing to HubSpot, one opening
  # PRs. The rule existed; nothing was watching.
  - id: fleet-docs
    engine: Fleet health
    name: Fleet — registry check + FLEET.md
    owner: roman@wetutorathome.com
    status: active
    trigger:
      type: event
      events: [pull_request, push, workflow_dispatch]
      source: >
        Any change to registry.yml, .github/workflows/**, or the two
        fleet-health scripts. PRs run advisory; main regenerates and commits.
      workflow: .github/workflows/fleet-docs.yml
    entrypoint: ops/fleet-health/registry_check.py
    reads:
      - registry.yml
      - .github/workflows/                   # both-directions cross-check
      - docs/FLEET.md                        # staleness check
    writes:
      - docs/FLEET.md                        # regenerated + committed back on main
    depends_on:
      - ops/fleet-health/fleet_brief.py
    notes: >
      ROLLOUT: PR runs use --warn, so an unregistered workflow annotates the PR
      without blocking the merge. Drop the flag once it has run clean for a
      couple of weeks and it starts blocking. Checks: workflows <-> registry
      both directions, required fields (incl. engine), unique ids, entrypoints
      exist, FLEET.md current. The main-branch commit carries [skip ci].

  - id: branch-hygiene
    engine: Fleet health
    name: Fleet — branch hygiene (Mon 9 AM PT)
    owner: roman@wetutorathome.com
