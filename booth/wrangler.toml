name = "sage-oak-booth"
main = "worker.js"
compatibility_date = "2026-08-11"

[vars]
# Sender domain must be verified in Resend — wetutorathome.com is (aplustutoring.com is not)
RESEND_FROM = "A+ Tutoring <photos@wetutorathome.com>"
# Set to the deployed Pages URL after `wrangler pages project create sage-oak-booth`
ALLOWED_ORIGIN = "https://sage-oak-booth.pages.dev"

# Secrets (never in this file — set via CLI):
#   wrangler secret put HUBSPOT_TOKEN
#   wrangler secret put RESEND_API_KEY
