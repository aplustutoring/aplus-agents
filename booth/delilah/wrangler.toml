name = "delilah-booth"
main = "worker.js"
compatibility_date = "2026-08-11"

# Workers Logs: keeps console.error("storybook failed", ...) in the dashboard
# (Workers & Pages > delilah-booth > Logs) so a failed paint is never invisible.
[observability]
enabled = true

# Personal event booth: Delilah's 5th birthday + Rosh Hashanah 5787, 2026-09-11.
# No HubSpot, no email, no cron (so no SUNSET needed: nothing runs unattended).

[vars]
# The Worker serves public/index.html itself (assets below), so the API is same-origin.
ALLOWED_ORIGIN = "https://delilah-booth.nameless-mountain-bafa.workers.dev"
# JustCall MMS sender: 818-573-6293 ("Roman's line" in ops/call_agent/config.yml,
# MMS-capable). Confirmed by Roman 2026-09-10 (his "6793" was a typo for this one).
JUSTCALL_FROM = "+18185736293"
SMS_BODY = "Hi {name}! Here is your photo from Delilah's 5th birthday. Shana Tova and thank you for celebrating with us!"
STORYBOOK_SMS_BODY = "And here is your storybook version, {name}. Once upon a Shana Tova!"
# Gemini image model for the storybook repaint (GEMINI_API_KEY is a secret)
GEMINI_MODEL = "gemini-3.1-flash-image"
# Google Drive mirror: every print lands at the top of the "Delilah's Bday"
# SHARED DRIVE (Roman is manager, the spotlight-watcher service account is
# content manager). Must be a shared drive: Google gives service accounts no
# storage quota, so an SA-owned folder in My Drive rejects uploads (403).
# https://drive.google.com/drive/folders/0AFzOAF0xZUy-Uk9PVA
DRIVE_FOLDER_ID = "0AFzOAF0xZUy-Uk9PVA"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "PHOTOS"
id = "cdaa219ac27248089b3867cf137812a4"

# Secrets (never in this file — set via CLI):
#   wrangler secret put JUSTCALL_API_KEY
#   wrangler secret put JUSTCALL_API_SECRET
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put GOOGLE_SA_JSON   (spotlight-watcher service-account JSON, one line)
