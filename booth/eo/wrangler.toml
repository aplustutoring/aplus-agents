name = "eo-booth"
main = "worker.js"
compatibility_date = "2026-08-20"

[vars]
# EVENT-TEMP — EO LA Valley, 2026-08-20. Sunset 2026-08-22.

# Guardrail: dry_run logs every send instead of making it. LIVE as of
# 2026-08-20 15:30 PT — real texts and emails go out from here.
MODE = "send"

# Sender domain must be verified in Resend. wetutorathome.com is verified,
# but the display name must NOT read as A+ — the mystery is the demo.
RESEND_FROM = "Minion #23 <minion23@wetutorathome.com>"

ALLOWED_ORIGIN = "https://eo-booth.pages.dev"

# Booth line. NOT the main A+ line (+18188506284). Confirmed against the
# JustCall API 2026-08-20: sms_compliance=Verified, MMS=Yes,
# business_registration=Approved. Roman's call to use 6293 over the 6258 in
# the original brief; both are verified, 6293 is the one not in day-to-day
# use, so booth traffic cannot collide with real customer threads.
JUSTCALL_FROM = "+18185736293"

# Zapier catch-hook → Google Sheet "EO Agent Ideas — Aug 20".
# Set with `wrangler secret put ZAPIER_IDEAS_HOOK` (it is a capability URL).

# A Zapier/Apps-Script hook that pulls the two image URLs into Crystal's
# shared Drive folder. The booth does not print, so this folder is where all
# prints come from afterwards — worth setting. Unset = the upload is skipped
# silently; the photo and hero URLs still land on the contact's timeline and
# the images stay in KV, so it is re-runnable rather than lost.
# DRIVE_UPLOAD_HOOK = ""
# DRIVE_FOLDER_ID   = ""

# Photos, hero images, and STOP opt-out flags. Shares the Sage Oak
# namespace; every key this Worker writes is prefixed `eo/` or `optout:`,
# so post-event cleanup is a prefix delete.
[[kv_namespaces]]
binding = "PHOTOS"
id = "38b24fd52f064143a0273d9f43a85a3c"

# Cron A — 6:17 PM PT Aug 20 = 01:17 UTC Aug 21 (PT is UTC-7 in August).
# Cron B — 8:00 PM PT Aug 20 = 03:00 UTC Aug 21.
# Cloudflare crons have NO date component: these fire again at the same UTC
# time on Aug 22, 23, ... until deleted. Disabling them is load-bearing
# cleanup, not hygiene.
#
# The every-minute cron is the work queue. Research takes ~75s and
# waitUntil() gets killed long before that, so capture stays instant and this
# tick does the slow work: research, hero images, Drive upload, and Payload #1
# for anyone who arrives after 6:17. Within a minute of someone's photo, their
# brief is being written.
# PT is UTC-7 in August, so every evening slot lands on the NEXT UTC day:
#   * * * * *   every minute  — the work queue (research, hero, Drive)
#   17 1 * * *  = 6:17 PM PT  — Payload #1: triple text + research email
#   5  2 * * *  = 7:05 PM PT  — Build kit email (build block starts)
#   30 2 * * *  = 7:30 PM PT  — Mid-build encouragement text
#   0  3 * * *  = 8:00 PM PT  — Payload #2: hero MMS + closing email
[triggers]
crons = ["* * * * *", "17 1 * * *", "5 2 * * *", "30 2 * * *", "0 3 * * *"]

# Secrets (never in this file):
#   wrangler secret put HUBSPOT_TOKEN
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put JUSTCALL_API_KEY
#   wrangler secret put JUSTCALL_API_SECRET
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put ZAPIER_IDEAS_HOOK
